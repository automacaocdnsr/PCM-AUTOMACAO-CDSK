      const eqSel = _eqComboValidar('e');

        return;
      }
      os.equipamento = eqSel.descricao;
      if(!R('e-tag') || !R('e-tag').value.trim()) os.tag = eqSel.tag;
    }
  }
  if(R('e-tag')) os.tag           = R('e-tag').value;
  if(R('e-ar-1')||R('e-ar-2')||R('e-ar-3')) os.area = ['Fase 1','Fase 2','Fase 3'].filter(f=>R('e-ar-'+f.slice(-1))&&R('e-ar-'+f.slice(-1)).checked).join(' + ') || '';
  if(R('e-ex'))  os.executante    = R('e-ex').value;
  if(R('e-sol')) os.solicitante   = R('e-sol').value;
  if(R('e-dp'))  os.dataPrevista  = R('e-dp').value;
  if(R('e-ha'))  os.horaAbertura  = R('e-ha').value;
  if(R('e-di'))  os.dataInicio    = R('e-di').value;
  if(R('e-hi'))  os.horaInicio    = R('e-hi').value;
  if(R('e-dc'))  os.dataConclusao = R('e-dc').value;
  if(R('e-hc'))  os.horaConclusao = R('e-hc').value;
  if(R('e-hp-h')||R('e-hp-m')) os.hhPrevisto = _lerTempoEstimado('e-hp');
  if(R('e-hr-h')||R('e-hr-m')) os.hhReal = _lerTempoEstimado('e-hr');
  if(R('e-desc'))  os.descricao      = R('e-desc').value;
  if(R('e-causa')) os.causaRaiz      = R('e-causa').value;
  if(R('e-acao'))  os.acaoCorretiva  = R('e-acao').value;
  if(R('edit-pc-lista')) os.pecasUsadas = _pcAplicarDiferenca(os.pecasUsadas, _pcTemp);
  // Se mudou para Em Andamento e não tem dataInicio, registra agora
  if(os.status==='Em Andamento' && !os.dataInicio){
    const ag=new Date();
    os.dataInicio = ag.toLocaleDateString('pt-BR');

  }

  saveAll();
  cm();
  rOST();
}

// realmente descontado, e só pela DIFERENÇA em relação ao que já estava salvo).
let _pcTemp = [];
function _pcIniciar(pecas){
  _pcTemp = (pecas||[]).map(p=>({...p}));
}
// Quantidade ainda disponível de uma peça, considerando o que já foi colocado
// nesta lista de trabalho (mas ainda não descontado de verdade do Estoque)
function _pcDisponivel(cod){
  const est = ESTOQUE.find(e=>e.cod===cod);
  if(!est) return 0;
  const jaNaLista = _pcTemp.filter(p=>p.cod===cod).reduce((a,p)=>a+(+p.qtd||0),0);
  return (+est.qtd||0) - jaNaLista;
}

function _pcAdicionar(prefix){
  const cod=R(prefix+'-cod-sel')?R(prefix+'-cod-sel').value:'';
  const qtdInp=R(prefix+'-qtd');
  const qtd=qtdInp?Math.floor(+qtdInp.value||0):0;
  if(!cod){ alert('Selecione uma peça da lista de sugestões (só é possível usar peças já cadastradas no Estoque).'); return; }
  const est=ESTOQUE.find(e=>e.cod===cod);
  if(!est){ alert('Peça não encontrada no Estoque.'); return; }
  if(qtd<=0){ alert('Informe uma quantidade válida.'); return; }
  const disp=_pcDisponivel(cod);
  if(qtd>disp){ alert(`Estoque insuficiente para ${est.desc}. Disponível: ${disp} ${est.un||''}.`); return; }
  const existente=_pcTemp.find(p=>p.cod===cod);
  if(existente) existente.qtd+=qtd;
  else _pcTemp.push({cod:est.cod, desc:est.desc, un:est.un||'', vlrUnit:+est.vlr||0, qtd});
  if(R(prefix+'-cod-busca')) R(prefix+'-cod-busca').value='';
  if(R(prefix+'-cod-sel')) R(prefix+'-cod-sel').value='';
  if(qtdInp) qtdInp.value='';
  _pcRenderLista(prefix);
}

function _pcRenderLista(prefix){
  const host=R(prefix+'-lista');
  if(!host) return;
  if(!_pcTemp.length){
    host.innerHTML=`<div style="font-size:12px;color:var(--mut);padding:6px 0">Nenhuma peça adicionada ainda — a OS pode ser concluída sem registrar peças.</div>`;
    return;
  }
  const total=_pcTemp.reduce((a,p)=>a+(p.qtd*p.vlrUnit),0);
  const linhas=_pcTemp.map((p,i)=>`<tr>
    <td style="padding:6px 4px;font-size:12px">${esc(p.cod)} — ${esc(p.desc)}</td>
    <td style="padding:6px 4px;font-size:12px;text-align:center;white-space:nowrap">${p.qtd} ${esc(p.un||'')}</td>
    <td style="padding:6px 4px;font-size:12px;text-align:right;white-space:nowrap">${fR(p.vlrUnit)}</td>

    <td style="padding:6px 4px;text-align:right"><span onclick="_pcRemover('${prefix}',${i})" style="cursor:pointer;color:#ef4444" title="Remover">🗑️</span></td>

  host.innerHTML=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">

    <tbody>${linhas}</tbody>
  </table></div>
  <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bdr);margin-top:8px;padding-top:8px">
    <span style="font-size:12px;color:var(--mut)">Custo total em peças</span>
    <span style="font-size:16px;font-weight:800;color:var(--acc)">${fR(total)}</span>
  </div>`;
}
// Aplica no Estoque só a DIFERENÇA entre a lista antiga e a nova (nunca desconta em dobro)
function _pcAplicarDiferenca(antigas, novas){
  antigas = antigas||[]; novas = novas||[];
  const todosCods = new Set([...antigas.map(p=>p.cod), ...novas.map(p=>p.cod)]);
  todosCods.forEach(cod=>{
    const qOld = antigas.filter(p=>p.cod===cod).reduce((a,p)=>a+(+p.qtd||0),0);
    const qNew = novas.filter(p=>p.cod===cod).reduce((a,p)=>a+(+p.qtd||0),0);
    const delta = qNew - qOld; // positivo = consumiu mais agora, negativo = devolve ao estoque
    if(delta===0) return;
    const est = ESTOQUE.find(e=>e.cod===cod);
    if(est) est.qtd = Math.max(0, (+est.qtd||0) - delta);
  });
  return novas.map(p=>({...p}));
}

// Helper global para toggle do PM (evita problemas com onclick inline)

// ══ PLANO PREVENTIVO AUTOMATIZADO ══
// Gera um ID de OS único seguindo o mesmo padrão usado em criarOS()
function _novoOSIdAuto(){
  const ano = new Date().getFullYear();
  let n = OS_DATA.length + 1;
  let id = `OS-${ano}-${String(n).padStart(3,'0')}`;
  while(OS_DATA.some(o=>o.id===id)){ n++; id = `OS-${ano}-${String(n).padStart(3,'0')}`; }
  return id;
}
// Cria a próxima OS preventiva a partir de um plano, e vincula essa OS ao plano (planoPrevId)
function _gerarOSDoPlano(plano){
  const agora = new Date();
  const novaOS = {
    id: _novoOSIdAuto(),
    tipo:'Preventiva', prioridade:'Média',
    dataAbertura: agora.toLocaleDateString('pt-BR'),
    horaAbertura: agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
    dataPrevista: plano.proximaData,
    dataInicio:'', horaInicio:'', dataConclusao:'', horaConclusao:'',
    equipamento: plano.eq, tag: plano.tag||'', area: plano.area||'',
    solicitante:'Plano Preventivo (Automático)', executante: '',
    especialidade:'',
    descricao: plano.desc || ('Manutenção preventiva programada — '+plano.eq+' ('+plano.freq+')'),
    causaRaiz:'PM programada', acaoCorretiva:'',
    hhPrevisto: plano.hh||4, hhReal:0, status:'Aguardando', okTecnico:false, comentarios:[], foto:'[]',
    planoPrevId: plano.id, esteiraParada:null,
  };
  OS_DATA.unshift(novaOS);
  plano.osAtualId = novaOS.id;
  return novaOS;
}
// Preenche campos novos em planos antigos (criados antes desta automação existir).
// Por segurança, planos antigos entram com ativo:false (modo manual/legado) — o
// usuário decide quando quer ativar a geração automática de OS para cada um.
function _migrarPlano(p){
  let mudou = false;
  if(!p.id){ p.id = 'PM'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); mudou = true; }
  if(!p.freqDias){ p.freqDias = FREQ_DIAS[p.freq]||30; mudou = true; }
  if(p.desc===undefined){ p.desc=''; mudou = true; }
  if(p.ultimaConclusao===undefined){ p.ultimaConclusao=''; mudou = true; }
  if(p.osAtualId===undefined){ p.osAtualId=null; mudou = true; }
  if(p.ativo===undefined){ p.ativo=false; mudou = true; }
  if(!p.proximaData){ p.proximaData = _addDiasBR(new Date().toLocaleDateString('pt-BR'), p.freqDias); mudou = true; }
  return mudou;
}
// Ativa a automação para um plano: garante que ele tenha uma OS em aberto vinculada
function ativarAutomacaoPlano(idx){
  const p = PLANO_PREV[idx]; if(!p) return;
  p.ativo = true;
  p.freqDias = p.freqDias || FREQ_DIAS[p.freq] || 30;
  // Reativar sempre recomeça a contagem a partir de HOJE — antes, isso só acontecia
  // se "proximaData" estivesse vazia, então reativar um plano pausado mantinha a
  // data antiga (de antes de pausar) e nenhuma OS nova aparecia pra hoje.
  p.proximaData = _addDiasBR(new Date().toLocaleDateString('pt-BR'), 0);
  if(!p.osAtualId){
    const existente = OS_DATA.find(o=>o.planoPrevId===p.id && o.status!=='Concluída');
    if(existente){ p.osAtualId = existente.id; existente.dataPrevista = p.proximaData; }
    else _gerarOSDoPlano(p);
  }else{
    // Já existe uma OS aberta vinculada — atualiza a Data Prevista dela pra hoje também
    const os = OS_DATA.find(o=>o.id===p.osAtualId);
    if(os) os.dataPrevista = p.proximaData;
  }
  saveAll(); rPM(R('pc'));
}
function desativarAutomacaoPlano(idx){
  const p = PLANO_PREV[idx]; if(!p) return;
  if(!confirm('Desativar a geração automática de OS para "'+p.eq+'"?\n\nA OS em aberto (se houver) continua existindo normalmente, mas nenhuma OS nova será criada automaticamente quando ela for concluída.')) return;
  p.ativo = false;
  saveAll(); rPM(R('pc'));
}
// Chamado sempre que uma OS é marcada como Concluída (nos 3 pontos do app onde
// isso acontece). Se essa OS veio de um plano preventivo automatizado, atualiza
// o plano (última conclusão + próxima data) e já gera a próxima OS.
function _onOSConcluida(os){
  if(!os || !os.planoPrevId) return;
  const plano = PLANO_PREV.find(p=>p.id===os.planoPrevId);
  if(!plano) return;
  // Só processa se essa é EXATAMENTE a OS que o plano está aguardando —
  // evita reprocessar/duplicar se o usuário só reabrir e re-salvar uma OS
  // que já tinha sido concluída antes.
  if(plano.osAtualId !== os.id) return;
  plano.ultimaConclusao = os.dataConclusao || new Date().toLocaleDateString('pt-BR');
  plano.freqDias = plano.freqDias || FREQ_DIAS[plano.freq] || 30;
  plano.proximaData = _addDiasBR(plano.ultimaConclusao, plano.freqDias);
  plano.osAtualId = null;
  // Mantém o grid mensal legado visualmente coerente (compatibilidade)
  try{
    const dt = _parseDt(plano.ultimaConclusao);
    if(dt && Array.isArray(plano.m)) plano.m[dt.mes-1] = '✅';
  }catch(e){}
  if(plano.ativo) _gerarOSDoPlano(plano);
}

function rPM(c){
  const admin=isAdmin();
  // Migra planos antigos (garante que tenham os novos campos) — idempotente
  let _mudouMigracao=false;
  PLANO_PREV.forEach(p=>{ if(_migrarPlano(p)) _mudouMigracao=true; });
  // Auto-cura: corrige datas que ficaram caindo em sábado/domingo por causa do
  // bug antigo de _addDiasBR (que só pulava domingo, não sábado). Reaproveita
  // _addDiasBR com 0 dias: ele só reavalia o dia da semana e empurra pra
  // segunda se necessário, sem alterar nada se a data já for dia útil.
  PLANO_PREV.forEach(p=>{
    if(!p.proximaData) return;
    const corrigida = _addDiasBR(p.proximaData, 0);
    if(corrigida && corrigida!==p.proximaData){ p.proximaData = corrigida; _mudouMigracao=true; }
  });
  OS_DATA.forEach(o=>{
    if(!o.planoPrevId || o.status==='Concluída' || !o.dataPrevista) return;
    const corrigida = _addDiasBR(o.dataPrevista, 0);
    if(corrigida && corrigida!==o.dataPrevista){ o.dataPrevista = corrigida; _mudouMigracao=true; }
  });
  // Auto-cura: plano ativo sem OS vinculada (ex.: a OS foi excluída direto na
  // aba de Ordens de Serviço) — gera uma nova pra não deixar o plano "parado"
  PLANO_PREV.forEach(p=>{
    if(!p.ativo || p.osAtualId) return;
    const existente = OS_DATA.find(o=>o.planoPrevId===p.id && o.status!=='Concluída');
    if(existente) p.osAtualId = existente.id;
    else _gerarOSDoPlano(p);
    _mudouMigracao = true;
  });
  if(_mudouMigracao) saveAll();

  const selTh=admin?selHeaderCell('pm',PLANO_PREV.map((_,i)=>i)):'';

    const diff = _diffDiasHoje(os.dataPrevista);
    if(diff===null) return {txt:'—', cor:'#6b7a9b'};
    if(diff<0)  return {txt:'🔴 Atrasada '+Math.abs(diff)+'d', cor:'#ef4444'};

    <td style="text-align:center;font-size:12px;color:var(--mut);white-space:nowrap">${p.ultimaConclusao||'—'}</td>
    <td style="text-align:center;font-weight:700;white-space:nowrap">${_fmtHoras(p.hh)}</td>
    ${admin?`<td onclick="event.stopPropagation()" style="white-space:nowrap;display:flex;gap:4px">
      <button class="btn bs bsm" onclick="openEditPM(${idx})" title="Editar">✏️</button>
      ${p.ativo
        ?`<button class="btn bs bsm" onclick="desativarAutomacaoPlano(${idx})" title="Desativar geração automática de OS">⏸️</button>`
        :`<button class="btn bp bsm" onclick="ativarAutomacaoPlano(${idx})" title="Ativar geração automática de OS">▶️</button>`}
    </td>`:''}
  </tr>`;
  }).join('');

  c.innerHTML=`<div class="card"><div class="ch">
    <div class="ct">📅 Plano Mestre de Manutenção Preventiva</div>
    <div class="ctl">
      <span style="font-size:12px;color:var(--mut);display:flex;align-items:center;gap:10px;flex-wrap:wrap">

        <span style="display:flex;align-items:center;gap:4px">🟡 Próxima do prazo</span>
        <span style="display:flex;align-items:center;gap:4px">🔴 Atrasada</span>
        <span style="display:flex;align-items:center;gap:4px">⏸️ Automação desligada</span>
      </span>

function _cPM(){

function openNovPM(){sm(`<div class="mt">➕ Novo Plano Preventivo</div>${pmForm(null)}<div class="mac"><button class="btn bs" onclick="cm()">Cancelar</button><button class="btn bp" onclick="lockBtn(this,svNovPM)">✅ Adicionar</button></div>`);}
function svNovPM(){
  const p=_cPM();
  if(!p.eq){alert('Informe o equipamento');return;}
  p.id = 'PM'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  p.freqDias = FREQ_DIAS[p.freq]||30;
  p.ativo = R('pm-ativo') ? R('pm-ativo').checked : true;
  p.ultimaConclusao = '';
  p.osAtualId = null;

function openEditPM(idx){

function svEditPM(idx){
  const plano = PLANO_PREV[idx];
  const p=_cPM();
  if(!p.eq){alert('Informe o equipamento');return;}
  p.m = plano.m;
  p.id = plano.id;
  p.ultimaConclusao = plano.ultimaConclusao;
  p.osAtualId = plano.osAtualId;
  p.freqDias = FREQ_DIAS[p.freq]||plano.freqDias||30;
  const jaEstavaAtivo = plano.ativo;
  p.ativo = R('pm-ativo') ? R('pm-ativo').checked : plano.ativo;
  const proxInput = R('pm-prox') ? R('pm-prox').value.trim() : '';
  p.proximaData = proxInput || plano.proximaData;
  Object.assign(plano,p);
  // Se acabou de ativar a automação agora e ainda não tem OS em aberto, gera uma
  if(p.ativo && !jaEstavaAtivo && !plano.osAtualId){
    const existente = OS_DATA.find(o=>o.planoPrevId===plano.id && o.status!=='Concluída');
    if(existente) plano.osAtualId = existente.id;
    else _gerarOSDoPlano(plano);
  }
  saveAll();cm();rPM(R('pc'));
}

// Estado de navegação
// Detecta o ano com mais OS para usar como padrão
let _indAno = (function(){
  const anos = {};
  OS_DATA.forEach(o=>{ const y=_anoRefOS(o); if(y) anos[y]=(anos[y]||0)+1; });
  const entries = Object.entries(anos);
  if(entries.length===0) return new Date().getFullYear();
  return +entries.sort((a,b)=>b[1]-a[1])[0][0];
})();
let _indMes = null; // null = visão anual

const MESES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// Extrai ano e mês de uma data no formato dd/mm/yyyy
function _parseDt(s){
  if(!s) return null;
  const [d,m,y] = s.split('/');
  if(!y||!m) return null;
  return {ano:+y, mes:+m, dia:+d};
}
// Data usada para agrupar/contar uma OS por mês/ano em qualquer tela (Dashboard, Modo TV,
// Indicadores etc). OS geradas por Plano Preventivo contam pelo mês em que DEVEM ser
// concluídas (dataPrevista) — não pelo mês em que foram geradas (dataAbertura). Assim, uma
// OS programada para dezembro só aparece nos totais/aguardando/concluídas quando o painel
// estiver mostrando dezembro, e não no mês em que ela foi criada automaticamente pelo plano.
// Diz se uma OS deve ser contada num período (ano, mês) filtrado em qualquer tela
// (Dashboard, Modo TV, Indicadores, gráficos etc). Regra:
// - OS de Plano Preventivo: só conta se a Data Prevista cair no mês/ano REAIS de hoje —
//   independe do período (ano/mês) que está sendo visualizado no filtro. Uma OS programada
//   pra dezembro nunca aparece em nenhum período, exceto quando hoje realmente for dezembro.
// - OS normais: contam pela data de abertura, respeitando o período filtrado normalmente.
function _incluiOSNoPeriodo(o, ano, mes){
  if(o.planoPrevId){
    const hoje = new Date();
    const dp = _parseDt(o.dataPrevista);
    return !!dp && dp.ano===hoje.getFullYear() && dp.mes===(hoje.getMonth()+1);
  }
  const dt = _parseDt(o.dataAbertura);
  if(!dt) return false;
  if(mes!==null && mes!==undefined) return dt.ano===ano && dt.mes===mes;
  return dt.ano===ano;
}
// Ano "efetivo" de uma OS para listas/seletores de ano (ex: anos disponíveis no Dashboard).
// Para OS de Plano Preventivo, só existe um ano efetivo quando ela está no mês real de hoje;
// caso contrário retorna null (não entra em nenhuma lista de ano).
function _anoRefOS(o){
  if(o.planoPrevId){
    const hoje = new Date();
    const dp = _parseDt(o.dataPrevista);
    return (dp && dp.ano===hoje.getFullYear() && dp.mes===(hoje.getMonth()+1)) ? dp.ano : null;
  }
  const dt = _parseDt(o.dataAbertura);
  return dt ? dt.ano : null;
}

// ══ PLANO PREVENTIVO AUTOMATIZADO — helpers de frequência/data ══
// Tempo estimado (previsto) das OS é digitado em HORAS + MINUTOS na interface
// (dois campos lado a lado), mas continua sendo armazenado internamente como
// decimal de horas (compatível com dados já existentes no Supabase e com os
// cálculos de MTBF/MTTR/custos). Negativos nunca são aceitos.
function _hmToHoras(h,m){
  h = Math.max(0, parseInt(h)||0);
  m = Math.max(0, Math.min(59, parseInt(m)||0));
  return +(h + m/60).toFixed(4);
}
function _horasToHM(dec){
  dec = Math.max(0, parseFloat(dec)||0);
  let h = Math.floor(dec);
  let m = Math.round((dec-h)*60);
  if(m===60){ h++; m=0; }
  return {h, m};
}
// Formata decimal de horas como "1h30min", "2h" ou "45min" para exibição
function _fmtHoras(dec){
  const {h,m} = _horasToHM(dec);
  if(h && m) return h+'h'+String(m).padStart(2,'0')+'min';
  if(h) return h+'h';
  return m+'min';
}
// Gera o par de inputs Horas/Minutos. min="0" + oninput bloqueiam negativos na
// UI, e _hmToHoras garante isso também na leitura (defesa em profundidade).
function _tempoEstimadoInputs(prefixId, decHoras, label){
  const {h,m} = _horasToHM(decHoras);
  return `<div class="fg"><label>${label||'Tempo Estimado'}</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input class="inp" type="number" min="0" step="1" id="${prefixId}-h" value="${h}" oninput="if(this.value<0)this.value=0" style="flex:1">
      <span style="color:var(--mut);font-size:12px;white-space:nowrap">h</span>
      <input class="inp" type="number" min="0" max="59" step="1" id="${prefixId}-m" value="${m}" oninput="if(this.value<0)this.value=0;if(this.value>59)this.value=59" style="flex:1">
      <span style="color:var(--mut);font-size:12px;white-space:nowrap">min</span>
    </div>
  </div>`;
}

const FREQ_DIAS = {Diária:1, Semanal:7, Quinzenal:15, Mensal:30, Bimestral:60, Trimestral:90, Semestral:180, Anual:365};
// Soma N dias a uma data no formato "dd/mm/aaaa" e devolve no mesmo formato.
// Se a data resultante cair em um sábado ou domingo (empresa não funciona nesses
// dias), empurra automaticamente para a segunda-feira seguinte.
function _addDiasBR(dataBR, dias){
  const dt = _parseDt(dataBR);
  if(!dt) return '';
  const d = new Date(dt.ano, dt.mes-1, dt.dia);
  d.setDate(d.getDate() + (dias||0));
  const dow = d.getDay();
  if(dow===0) d.setDate(d.getDate()+1);      // domingo -> segunda
  else if(dow===6) d.setDate(d.getDate()+2); // sábado -> segunda
  return d.toLocaleDateString('pt-BR');
}
// Diferença em dias entre hoje e uma data "dd/mm/aaaa" (negativo = atrasado, positivo = no futuro)
function _diffDiasHoje(dataBR){
  const dt = _parseDt(dataBR);
  if(!dt) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const alvo = new Date(dt.ano, dt.mes-1, dt.dia);
  return Math.round((alvo - hoje) / 86400000);
}

function _calcInd(ano, mes){
  // Filtra OS EXATAMENTE pelo período — sem nenhum fallback
  const osFinal = OS_DATA.filter(o=>_incluiOSNoPeriodo(o,ano,mes));

  // Verifica se há dados no ano (para aviso)
  const temNoAno = OS_DATA.some(o=>_anoRefOS(o)===ano);
  const semDados = !temNoAno;
  const usandoTodos = mes!==null && osFinal.length===0;

  return _calcIndDireto(osFinal, mes, ano, semDados, usandoTodos);
}

// Calcula direto de um array de OS já filtrado (sem fallback)
function _calcIndDireto(osArr, mes, ano, semDados, usandoTodos){
  semDados = semDados||false;
  usandoTodos = usandoTodos||false;
  const total = osArr.length;
  const conc  = osArr.filter(o=>o.status==='Concluída').length;
  const corr  = osArr.filter(o=>o.tipo==='Corretiva').length;
  const prev  = osArr.filter(o=>o.tipo==='Preventiva').length;
  const pred  = osArr.filter(o=>o.tipo==='Preditiva').length;
  const emg   = osArr.filter(o=>o.status==='Emergência').length;
  const hoje  = new Date(); hoje.setHours(0,0,0,0);
  const atraso= osArr.filter(o=>{ const dp=_parseDt(o.dataPrevista); return dp&&o.status!=='Concluída'&&new Date(dp.ano,dp.mes-1,dp.dia)<hoje; }).length;
  const hhP   = +osArr.reduce((a,o)=>a+(+o.hhPrevisto||0),0).toFixed(2);
  const hhR   = +osArr.reduce((a,o)=>a+(+o.hhReal||0),0).toFixed(2);
  // ── MTTR: Tempo Médio de Reparo ──
  // = média das horas reais gastas nas OS corretivas concluídas
  const corrConc = osArr.filter(o=>o.tipo==='Corretiva'&&o.status==='Concluída'&&+o.hhReal>0);
  const mttr = corrConc.length>0
    ? +(corrConc.reduce((a,o)=>a+(+o.hhReal||0),0)/corrConc.length).toFixed(1)
    : null;

  // ── MTBF e Disponibilidade ──
  // Ambos baseados no histórico real de paradas dos Equipamentos (status
  // Parado/Em Manutenção, e OS concluídas com "esteira parada = Sim").
  // MTBF: quanto maior, menos falhas ocorrem → melhor.
  // Disponibilidade: % do tempo em que os equipamentos ficaram operando → melhor quanto maior.
  const _indEquipMes = _calcIndicadoresEquip(ano, mes);
  const mtbf = _indEquipMes.mtbf!==null ? +_indEquipMes.mtbf.toFixed(0) : null;
  const di   = _indEquipMes.disponibilidade!==null ? +_indEquipMes.disponibilidade.toFixed(1) : 100;
  const ids  = new Set(osArr.map(o=>o.id));
  const cuReg  = CUSTOS_DATA.filter(x=>ids.has(x.os)).reduce((a,x)=>a+(+x.total||0),0);
  // Custo de peças: soma do valor (qtd × valor unitário no momento do uso) de todas as
  // peças usadas nas OS do período — essa é a base real do Custo Total, no lugar da
  // estimativa antiga por HH trabalhado.
  const cuPecas = osArr.reduce((a,o)=>a+(o.pecasUsadas||[]).reduce((a2,p)=>a2+((+p.qtd||0)*(+p.vlrUnit||0)),0),0);
  const cu   = cuReg + cuPecas;
  const cuFonte = cu>0?'registrado':'sem_dados';
  return {
    total,conc,corr,prev,pred,emg,atraso,hhP,hhR,di,cu,cuFonte,semDados,usandoTodos,
    mtbf:mtbf||0, mttr:mttr||0, mtbfOk:mtbf!==null, mttrOk:mttr!==null,
    pCorr:total>0?+((corr/total)*100).toFixed(1):0,
    pPrev:total>0?+((prev/total)*100).toFixed(1):0,
    pPred:total>0?+((pred/total)*100).toFixed(1):0,
  };
}

function parseDuracaoSeg(d){
  if(!d||d==='0') return 0;
  d=d.trim();
  // Formato: HH:MM:SS.mmm ou MM:SS.mmm ou SS.mmm
  const p=d.split(':');
  let seg=0;
  if(p.length===3){seg=+p[0]*3600 + +p[1]*60 + parseFloat(p[2]);}
  else if(p.length===2){seg=+p[0]*60 + parseFloat(p[1]);}
  else{seg=parseFloat(p[0]);}
  return Math.round(seg);
}

function detectarCategoria(alarme){
  const a=(alarme||'').toUpperCase();
  if(a.includes('EMERGÊNCIA')||a.includes('EMERGENCIA')) return 'EMERGÊNCIA';
  if(a.includes('REJEITO')) return 'REJEITO';
  if(a.includes('TCH')) return 'FALHA TCH';
  if(a.includes('CRA')) return 'FALHA CRA';
  if(a.includes('TCI')||a.includes('TRA')) return 'FALHA ESTEIRA';
  return 'OUTRO';
}

function detectarFase(alarme){
  const a=(alarme||'').toUpperCase();
  if(a.includes('FASE 01')||a.includes('FASE 1')||a.includes('SORTER')) return '1';
  if(a.includes('FASE 02')||a.includes('FASE 2')) return '2';
  if(a.includes('FASE 03')||a.includes('FASE 3')) return '3';
  return null;
}

function parseCSVParadas(txt){
  const linhas = txt.split(/\r?\n/).filter(l=>l.trim());
  const sep = txt.includes(';') ? ';' : ',';
  const dados = [];
  let ignoradosOutraCategoria = 0;
  for(let i=1;i<linhas.length;i++){
    const cols = linhas[i].split(sep);
    if(cols.length < 7) continue;
    const alarme = (cols[3]||'').trim();
    const inicioRaw = (cols[4]||'').trim();
    const reconhRaw = (cols[5]||'').trim();
    const duracaoRaw = (cols[6]||'').trim();
    const status = (cols[7]||'').trim();
    // Ignorar SystemAlarm
    if((cols[1]||'').trim()==='SystemAlarm') continue;
    const categoria = detectarCategoria(alarme);
    // Registrar SOMENTE paradas de Emergência Pressionada e Rejeito Cheio — as demais são descartadas
    if(categoria!=='EMERGÊNCIA' && categoria!=='REJEITO'){ ignoradosOutraCategoria++; continue; }
    // Parsear data
    let inicio = null;
    try{ inicio = new Date(inicioRaw); if(isNaN(inicio)) inicio=null; }catch(e){}
    let reconh = null;
    try{ reconh = reconhRaw ? new Date(reconhRaw) : null; if(reconh&&isNaN(reconh)) reconh=null; }catch(e){}
    const durSeg = parseDuracaoSeg(duracaoRaw);
    const fase = detectarFase(alarme);
    // Verificar duplicata (mesmo alarme + mesmo inicio)
    const key = alarme+'|'+(inicio?inicio.toISOString():'');
    if(dados.find(d=>d._key===key)) continue;
    dados.push({
      _key: key,
      alarme_id: +(cols[0]||0)||0,
      tipo: (cols[1]||'').trim(),
      local: (cols[2]||'').trim(),
      alarme,
      inicio: inicio ? inicio.toISOString() : null,
      reconhecimento: reconh ? reconh.toISOString() : null,
      duracao: duracaoRaw,
      duracao_seg: durSeg,
      status,
      fase,
      categoria,
    });
  }
  dados._ignoradosOutraCategoria = ignoradosOutraCategoria;
  return dados;
}

function importarCSVParadas(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    const txt = e.target.result;
    const novos = parseCSVParadas(txt);
    const ignoradosCategoria = novos._ignoradosOutraCategoria||0;
    const novasLinhas = [];
    novos.forEach(n=>{
      // Acumulativo: só adiciona se não existir
      const existe = PARADAS_DATA.find(p=>p._key===n._key);
      if(!existe){ PARADAS_DATA.push(n); novasLinhas.push(n); }
    });
    const adicionados = novasLinhas.length;
    rParadas(R('pc'));
    // Sincroniza SÓ as linhas novas (somente inserção — nunca apaga a tabela),
    // evitando que duas pessoas importando ao mesmo tempo apaguem o trabalho
    // uma da outra.
    const resultado = await _syncParadasNovas(novasLinhas);
    const resumo = adicionados+' registros importados ('+( novos.length-adicionados)+' já existiam, '+ignoradosCategoria+' ignorados por não serem Emergência ou Rejeito Cheio)';
    if(resultado && resultado.ok===false){
      alert(resumo+'.\n\nATENÇÃO: houve FALHA ao sincronizar com o Supabase.\n\nOs dados ficaram salvos apenas neste navegador por enquanto. Abra o console (F12 → Console) para ver o motivo do erro.');
    }else{
      alert(resumo+' e salvos no Supabase!');
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function fmtDuracao(seg){
  if(!seg||seg===0) return '—';
  if(seg<60) return seg+'s';
  if(seg<3600) return Math.floor(seg/60)+'min '+(seg%60)+'s';
  return Math.floor(seg/3600)+'h '+Math.floor((seg%3600)/60)+'min';
}

      <div style="display:flex;gap:6px;margin-left:auto;flex-wrap:wrap">
        <button onclick="window._paradaDe=new Date(Date.now()-6*86400000).toISOString().substring(0,10);window._paradaAte='${maxData}';rParadas(R('pc'))" style="background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:6px 12px;color:var(--txt);cursor:pointer;font-size:12px">Últimos 7 dias</button>
        <button onclick="window._paradaDe=new Date(Date.now()-29*86400000).toISOString().substring(0,10);window._paradaAte='${maxData}';rParadas(R('pc'))" style="background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:6px 12px;color:var(--txt);cursor:pointer;font-size:12px">Últimos 30 dias</button>
        <button onclick="window._paradaDe='${minData}';window._paradaAte='${maxData}';rParadas(R('pc'))" style="background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:6px 12px;color:var(--txt);cursor:pointer;font-size:12px">Tudo</button>
      </div>
    </div>
    <!-- KPIs do período -->
    <div style="padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--bdr)">${kpiHtml}</div>
    <!-- Top locais (gráfico horizontal) -->
    ${chartHtmlP}
    <!-- Cards por dia -->
    <div style="padding:16px 20px">
      <div style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">
        Dias com ocorrências no período — clique para ver detalhes do dia
      </div>
      ${diasOrdenados.length===0
        ? '<div style="text-align:center;padding:40px;color:var(--mut)">Nenhuma parada registrada nesse período</div>'
        : `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">${diasHtml}</div>`}
    </div>`;
  }

  // ── BOTÕES DE VISTA ──
  const vistaHtml = `<div style="display:flex;gap:4px;background:var(--surf2);border-radius:8px;padding:3px">
    <button onclick="window._paradaVista='mensal';rParadas(R('pc'))"
      style="padding:5px 14px;border-radius:6px;border:none;font-family:'Roboto Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;
      background:${vista==='mensal'?'var(--acc)':'transparent'};color:${vista==='mensal'?'#fff':'var(--mut)'}">📊 Mensal</button>
    <button onclick="window._paradaVista='dia';rParadas(R('pc'))"
      style="padding:5px 14px;border-radius:6px;border:none;font-family:'Roboto Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;
      background:${vista==='dia'?'var(--acc)':'transparent'};color:${vista==='dia'?'#fff':'var(--mut)'}">📅 Dia</button>
    <button onclick="window._paradaVista='periodo';rParadas(R('pc'))"
      style="padding:5px 14px;border-radius:6px;border:none;font-family:'Roboto Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;
      background:${vista==='periodo'?'var(--acc)':'transparent'};color:${vista==='periodo'?'#fff':'var(--mut)'}">📆 Período</button>
  </div>`;

  c.innerHTML=`<div class="card">
    <div class="ch">
      <div class="ct">🛑 Paradas de Linha</div>
      <div class="ctl">
        ${vistaHtml}
        <label class="btn bp bsm" style="cursor:pointer">📂 Importar CSV<input type="file" accept=".csv" style="display:none" onchange="importarCSVParadas(this.files[0])"></label>
      </div>
    </div>
    ${PARADAS_DATA.length===0?(_paradasLoadFailed?`<div style="text-align:center;padding:80px 20px;color:#ef4444">
      <div style="font-size:48px;margin-bottom:16px">⚠️</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:8px">Falha ao carregar os dados do Supabase</div>
      <div style="font-size:13px;color:var(--mut);max-width:420px;margin:0 auto 16px">Os dados podem existir no banco, mas não foi possível buscá-los agora (problema de conexão ou permissão). Abra o console (F12) para ver o detalhe do erro.</div>
      <button class="btn bp bsm" onclick="loadSavedQueued().then(()=>rParadas(R('pc')))">🔄 Tentar novamente</button>
    </div>`:`<div style="text-align:center;padding:80px 20px;color:var(--mut)">
      <div style="font-size:48px;margin-bottom:16px">📂</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:8px">Nenhum dado importado ainda</div>
      <div style="font-size:13px">Clique em "Importar CSV" para carregar os dados do supervisório</div>
    </div>`):(vista==='mensal'?renderMensal():vista==='periodo'?renderPeriodo():renderDia())}
  </div>`;

  // Plugin que desenha o número de paradas (contagem real) dentro de cada segmento da coluna
  const _rotuloDentroPlugin = {
    id: 'rotuloDentro',
    afterDatasetsDraw(chart){
      const {ctx} = chart;
      chart.data.datasets.forEach((dataset, dsIndex)=>{
        const meta = chart.getDatasetMeta(dsIndex);
        meta.data.forEach((bar, index)=>{
          const contagem = dataset.rawCounts ? dataset.rawCounts[index] : dataset.data[index];
          if(!contagem) return; // não desenha em segmentos vazios/zero
          ctx.save();
          ctx.fillStyle = '#fff';
          ctx.font = "700 11px 'Roboto Condensed', sans-serif";
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(contagem), bar.x, (bar.y + bar.base)/2);
          ctx.restore();
        });
      });
    }
  };

  // (Re)cria o gráfico de colunas verticais "Paradas por Dia" (eixo em %), se aplicável
  try{ if(_paradasChart){ _paradasChart.destroy(); _paradasChart=null; } }catch(e){}
  const canvasChart = R('pz-chart-h');
  if(canvasChart && _chartData && _chartData.labels.length>0){
    _paradasChart = new Chart(canvasChart, {
      type:'bar',
      plugins:[_rotuloDentroPlugin],
      data:{
        labels:_chartData.labels,
        datasets:[
          {label:'Emergência', data:_chartData.emergenciaPct, rawCounts:_chartData.emergencia, backgroundColor:'#c026d3', borderRadius:4, borderSkipped:false},
          {label:'Rejeito Cheio', data:_chartData.rejeitoPct, rawCounts:_chartData.rejeito, backgroundColor:'#f59e0b', borderRadius:4, borderSkipped:false},
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{display:true, position:'bottom', labels:{color:'#94a3b8', boxWidth:12, padding:14, font:{family:"'Roboto Condensed',sans-serif", size:12}}},
          tooltip:{callbacks:{label:ctx=>{
            const idx = ctx.dataIndex;
            const contagem = ctx.dataset.rawCounts ? ctx.dataset.rawCounts[idx] : 0;
            const segArr = ctx.datasetIndex===0 ? _chartData.emergenciaSeg : _chartData.rejeitoSeg;
            const dur = fmtDuracao((segArr&&segArr[idx])||0);
            return `  ${ctx.dataset.label}: ${contagem} parada${contagem!==1?'s':''} · ${dur} (${ctx.raw}%)`;
          }}}
        },
        scales:{
          x:{stacked:true, grid:{display:false}, ticks:{color:'#94a3b8', font:{size:11}}},
          y:{stacked:true, grid:{color:'rgba(255,255,255,.05)'}, ticks:{color:'#94a3b8', stepSize:20, callback:v=>v+'%'}, beginAtZero:true, max:100}
        }
      }
    });
  }

  // (Re)cria o gráfico de pizza "% Emergência x Rejeito", se aplicável
  try{ if(_paradasChartPct){ _paradasChartPct.destroy(); _paradasChartPct=null; } }catch(e){}
  const canvasPct = R('pz-chart-pct');
  if(canvasPct && _pctData && (_pctData.emergencia+_pctData.rejeito)>0){
    const totalPct = _pctData.emergencia+_pctData.rejeito;
    _paradasChartPct = new Chart(canvasPct, {
      type:'doughnut',
      data:{
        labels:['Emergência','Rejeito Cheio'],
        datasets:[{data:[_pctData.emergencia,_pctData.rejeito], backgroundColor:['#c026d3','#f59e0b'], borderWidth:0, hoverOffset:6}]
      },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{
          legend:{position:'bottom', labels:{color:'#94a3b8', boxWidth:12, padding:12, font:{family:"'Roboto Condensed',sans-serif", size:11}}},
          tooltip:{callbacks:{label:ctx=>{
            const pct = totalPct>0 ? ((ctx.raw/totalPct)*100).toFixed(1) : 0;
            return `  ${ctx.label}: ${ctx.raw} (${pct}%)`;
          }}}
        }
      }
    });
  }
}


function rUS(c){
  if(!isSA()){c.innerHTML='<div class="emp"><div style="font-size:40px;margin-bottom:10px">🔒</div>Acesso restrito ao Administrador</div>';return;}
  // Usuários protegidos contra exclusão em massa: o login 'admin' e o próprio usuário logado.
  const rows=USERS.map((u,i)=>{
    const canSel=u.id!==currentUser.id;
    return `<tr>
    ${canSel?selRowCell('us',i):'<td></td>'}
    <td>${u.id}</td><td><strong>${esc(u.name)}</strong></td>
    <td style="color:var(--mut)">${esc(u.username)}</td>
    <td>${'•'.repeat(Math.min(u.password.length,8))}</td>
    <td><span class="bdg r${u.role.slice(0,1)+u.role.slice(u.role==='administrador'?0:0)}" style="background:var(--surf2)">${rname(u.role)}</span></td>

    <td><button class="btn bs bsm" onclick="openEditUS(${i})">✏️ Editar</button></td>
  </tr>`;}).join('');
  const selTh=selHeaderCell('us',USERS.map((u,i)=>i).filter(i=>USERS[i].id!==currentUser.id));
  c.innerHTML=`<div class="card"><div class="ch"><div class="ct">👥 Gerenciamento de Usuários</div><button class="btn bp bsm" onclick="openNovUS()">➕ Novo Usuário</button></div>
    <div class="tw"><table><thead><tr>${selTh}<th>#</th><th>Nome</th><th>Usuário</th><th>Senha</th><th>Perfil</th><th>Área</th><th>Ações</th></tr></thead><tbody>${rows}</tbody></table></div></div><div id="us_selbar_host"></div>`;
  selClear('us');
  selRefreshHeader('us');
  setTimeout(applyDS,30);
}
window._selDelAction_us = function(){

  askDel(`${idxs.length} usuário${idxs.length>1?'s':''} selecionado${idxs.length>1?'s':''}`,function(){

function salvarMinhaSenha(){
  const p1=R('mc-pw1')?R('mc-pw1').value:'';
  const p2=R('mc-pw2')?R('mc-pw2').value:'';
  if(!p1||!p2){alert('Preencha os dois campos de senha.');return;}
  if(p1!==p2){alert('As senhas não coincidem. Digite a mesma senha nos dois campos.');return;}
  const u=USERS.find(x=>x.id===currentUser.id);
  if(!u){alert('Não foi possível localizar sua conta.');return;}
  u.password=p1;
  currentUser.password=p1;
  saveAll();cm();
  alert('Senha alterada com sucesso!');
}
function usForm(u){
  const ro=['administrador','lider','tecnico','auxiliar'].map(r=>`<option value="${r}"${u&&u.role===r?' selected':''}>${rname(r)}</option>`).join('');
  return `<div class="fg2"><div class="fg full"><label>Nome Completo *</label><input class="inp" id="us-nm" value="${esc(u?u.name:'')}"></div><div class="fg"><label>Login *</label><input class="inp" id="us-lg" value="${esc(u?u.username:'')}"></div><div class="fg"><label>Senha *</label><input class="inp" id="us-pw" value="${esc(u?u.password:'')}"></div><div class="fg"><label>Perfil</label><select class="inp" id="us-ro">${ro}</select></div><div class="fg"><label>Área/Setor</label><input class="inp" id="us-ar" value="${esc(u?u.area:'')}"></div></div>`;
}
function _cUS(){return {name:R('us-nm').value.trim(),username:R('us-lg').value.trim().toLowerCase(),password:R('us-pw').value.trim(),role:R('us-ro').value,area:R('us-ar').value.trim()};}
function openNovUS(){sm(`<div class="mt">➕ Novo Usuário</div>${usForm(null)}<div class="mac"><button class="btn bs" onclick="cm()">Cancelar</button><button class="btn bp" onclick="lockBtn(this,svNovUS)">✅ Criar</button></div>`);}
function svNovUS(){const u=_cUS();if(!u.name||!u.username||!u.password){alert('Nome, usuário e senha obrigatórios');return;}if(USERS.find(x=>x.username===u.username)){alert('Usuário já existe');return;}u.id=Math.max(...USERS.map(x=>x.id))+1;USERS.push(u);saveAll();cm();rUS(R('pc'));}
function openEditUS(idx){
  const u=USERS[idx];
  sm(`<div class="mt">✏️ Editar Usuário — ${esc(u.name)}</div>${usForm(u)}
    <div class="mac" style="justify-content:space-between">
      ${u.id!==currentUser.id?`<button class="btn bd" onclick="askDel('Usuário ${esc(u.name)} (${esc(u.username)})',function(){USERS.splice(${idx},1);saveAll();cm();rUS(R('pc'));})">🗑️ Apagar</button>`:'<span></span>'}
      <div style="display:flex;gap:10px"><button class="btn bs" onclick="cm()">Cancelar</button><button class="btn bp" onclick="lockBtn(this,()=>svEditUS(${idx}))">💾 Salvar</button></div>
    </div>`);
}
function svEditUS(idx){const u=_cUS();if(!u.name||!u.username||!u.password){alert('Nome, usuário e senha obrigatórios');return;}if(USERS.find((x,i)=>x.username===u.username&&i!==idx)){alert('Usuário já existe');return;}Object.assign(USERS[idx],u);if(currentUser&&currentUser.id===USERS[idx].id)currentUser=USERS[idx];saveAll();cm();rUS(R('pc'));}

const VAPID_PUBLIC_KEY = 'BEgJ_nuF9xUTuLpWZucHjtIOFMOa7uf-Cu1FgZa2FYcLIX8wZOcdUM_1b27S4BJNq4TFjrd5S6-iIb28Cbnu9qA';

function _urlB64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;i++) outputArray[i]=rawData.charCodeAt(i);
  return outputArray;
}

function _pushSuportado(){
  return 'serviceWorker' in navigator && 'PushManager' in window;
}

async function _atualizarStatusPush(){
  const st=R('mc-push-status'), btns=R('mc-push-btns');
  if(!st||!btns) return;
  if(!_pushSuportado()){
    st.textContent='⚠️ Este navegador/dispositivo não suporta notificações.';
    btns.innerHTML='';
    return;
  }
  if(Notification.permission==='denied'){
    st.textContent='🔕 Notificações bloqueadas nas configurações do navegador. Ative manualmente para usar.';
    btns.innerHTML='';
    return;
  }
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      st.textContent='✅ Notificações ativadas neste dispositivo.';
      btns.innerHTML=`<button class="btn bd" onclick="desativarNotificacoesPush()">🔕 Desativar</button>`;
    }else{
      st.textContent='Notificações ainda não ativadas neste dispositivo.';
      btns.innerHTML=`<button class="btn bp" onclick="ativarNotificacoesPush()">🔔 Ativar Notificações</button>`;
    }
  }catch(e){
    st.textContent='⚠️ Não foi possível verificar o status das notificações.';
    btns.innerHTML='';
  }
}

async function ativarNotificacoesPush(){
  if(!_pushSuportado()){ alert('Este navegador/dispositivo não suporta notificações.'); return; }
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ alert('Permissão de notificação não concedida.'); _atualizarStatusPush(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:_urlB64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const j = sub.toJSON();
    const res = await fetch(SB_URL+'/rest/v1/pcm_push_subscriptions', {
      method:'POST',
      headers:_sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal','Content-Type':'application/json'}),
      body: JSON.stringify([{
        endpoint: j.endpoint,
        p256dh: j.keys.p256dh,
        auth: j.keys.auth,
        username: currentUser?currentUser.username:null,
        criadoEm: new Date().toISOString()
      }])
    });
    if(!res.ok){
      const detalhe = await res.text().catch(()=>'');
      console.error('[Push] Falha ao salvar inscrição no Supabase', res.status, detalhe);
      alert('Notificações ativadas no dispositivo, mas houve um problema ao salvar no servidor. Tente novamente.');
    }
    _atualizarStatusPush();
  }catch(e){
    console.error('[Push] Erro ao ativar notificações', e);
    alert('Não foi possível ativar as notificações. Tente novamente.');
  }
}

async function desativarNotificacoesPush(){
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      await fetch(SB_URL+'/rest/v1/pcm_push_subscriptions?endpoint=eq.'+encodeURIComponent(endpoint), {
        method:'DELETE',
        headers:_sbHeaders()
      }).catch(()=>{});
    }
    _atualizarStatusPush();
  }catch(e){
    console.error('[Push] Erro ao desativar notificações', e);
  }
}
