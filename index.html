<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0d1829">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PCM">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PCM — Controle de Manutenção</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* ══ PALETAS ══ */
/* Cobalto Industrial (padrão) */
:root{
  --bg:#070d1a;--surf:#0d1829;--surf2:#112035;--bdr:#1a3050;--bdr2:#1e3a5f;
  --acc:#06b6d4;--acc2:#0284c7;--accD:rgba(6,182,212,.12);
  --txt:#e2e8f0;--mut:#5a7a9b;--mut2:#7a9ab8;
  --red:#f43f5e;--grn:#22c55e;--ylw:#f59e0b;--blu:#0284c7;--pur:#8b5cf6;--pnk:#c026d3;
  --navy:#0d1829;--navy2:#112035;--navy3:#152840;--navy-bdr:#1a3050;--navy-txt:#c8d4f0;--navy-mut:#5a7a9b;
  --r:10px;--r2:8px;
  --scheme:dark;
}
/* Modo Claro */
html[data-mode="light"]{
  --bg:#f0f4ff;--surf:#ffffff;--surf2:#e8eef8;--bdr:#d0daf0;--bdr2:#b8c8e0;
  --txt:#0d1829;--mut:#5a7a9b;--mut2:#7a9ab8;
  --red:#dc2626;--grn:#16a34a;--ylw:#d97706;--blu:#0284c7;--pur:#7c3aed;--pnk:#a21caf;
  --navy:#0d1829;--navy2:#112035;--navy3:#152840;--navy-bdr:#1a3050;--navy-txt:#c8d4f0;--navy-mut:#7a9ab8;
  --scheme:light;
}

body{background:var(--bg);color:var(--txt);font-family:'Roboto Condensed',sans-serif;min-height:100vh;font-size:14px;transition:background .3s,color .3s}
.hide{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surf2)}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}
/* LOGIN */
#ls{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f1f45 0%,#162455 50%,#1e3a6e 100%);position:relative;overflow:hidden}
#ls::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% -10%,rgba(249,115,22,.22),transparent)}
.lc{position:relative;z-index:1;background:var(--navy2);border:1px solid var(--navy-bdr);border-radius:18px;padding:48px 44px;width:440px;box-shadow:0 40px 100px rgba(0,0,0,.6);text-align:center}
.lb-title{font-size:26px;font-weight:800;color:var(--acc);text-align:center;width:100%}
.lb-sub{font-size:13px;color:var(--navy-mut);margin-bottom:32px;text-align:center;width:100%}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--navy-mut);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;text-align:left}
.fld input{width:100%;background:var(--navy2);border:1.5px solid var(--navy-bdr);border-radius:var(--r2);padding:11px 14px;color:var(--navy-txt);font-family:'Roboto Condensed',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.fld input:focus{border-color:var(--acc)}
#lbtn{width:100%;background:var(--acc);color:#fff;border:none;border-radius:var(--r2);padding:13px;font-family:'Roboto Condensed',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:all .2s}
#lbtn:hover{background:var(--acc2)}
#lerr{color:var(--red);font-size:12px;text-align:center;margin-top:8px;padding:8px;background:rgba(239,68,68,.08);border-radius:6px}
.dbox{margin-top:20px;background:var(--navy3);border:1px solid var(--navy-bdr);border-radius:10px;padding:14px}
.dt{font-size:10px;font-weight:700;color:var(--navy-mut);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.dr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:12px;color:var(--navy-txt)}
.dbs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.db{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid;background:transparent}
/* APP */
#app{display:flex;min-height:100vh}
.sb{width:240px;background:var(--navy);border-right:1px solid var(--navy-bdr);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid var(--navy-bdr);background:var(--navy);text-align:center}
.sb-logo{height:100px;object-fit:contain;display:block;margin-bottom:8px;max-width:100%;margin-left:auto;margin-right:auto}
.b-title{font-size:18px;font-weight:800;color:var(--acc)}
.b-sub{font-size:10px;color:var(--navy-mut);margin-top:2px}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--navy-mut);transition:all .15s;margin-bottom:3px;font-size:13px;font-weight:600;user-select:none}
.ni:hover{background:var(--navy3);color:var(--navy-txt)}
.ni.active{background:rgba(249,115,22,.18);color:var(--acc);border-left:3px solid var(--acc)}
.sb-foot{padding:14px;border-top:1px solid var(--navy-bdr)}
.ub{background:var(--navy2);border-radius:8px;padding:12px;border:1px solid var(--navy-bdr)}
.uav{width:36px;height:36px;border-radius:50%;background:rgba(249,115,22,.2);border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--acc);flex-shrink:0}
.unm{font-size:13px;font-weight:700;color:var(--navy-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url{font-size:11px;color:var(--navy-mut);margin-top:1px}
.ur{display:flex;align-items:center;gap:10px}
.lout{width:100%;background:transparent;border:1px solid var(--navy-bdr);color:var(--navy-mut);border-radius:6px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;margin-top:10px;transition:all .15s;font-family:'Roboto Condensed',sans-serif}
.lout:hover{border-color:#ef4444;color:#ef4444}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{padding:16px 28px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;background:var(--navy);flex-shrink:0;box-shadow:2px 0 12px rgba(0,0,0,.1)}
.tbt{font-size:20px;font-weight:800;color:#fff}
.tbr{display:flex;align-items:center;gap:12px}
#si{display:none;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid}
.tbm{font-size:11px;color:var(--navy-txt);background:var(--navy2);padding:4px 12px;border-radius:20px;border:1px solid var(--navy-bdr)}
.pc{padding:24px 28px;overflow-y:auto;flex:1;background:var(--bg);transition:background .3s}
/* KPI */
.kc{background:var(--surf);border-color:var(--bdr);box-shadow:0 2px 8px rgba(0,0,0,.15);border:1.5px solid var(--bdr);border-radius:14px;padding:22px 18px 18px;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .15s;cursor:pointer}
.ka{position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
/* CARD */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ch{padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surf);border-radius:var(--r) var(--r) 0 0}
.ct{font-size:15px;font-weight:800}
/* TABLE */
.tw{overflow-x:auto;border-radius:10px;max-height:calc(100vh - 180px)}.tw table thead th{position:sticky;top:0;z-index:10;background:#1a2340;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.tm{overflow-x:auto;overflow-y:hidden;height:10px;background:var(--surf2);border-bottom:1px solid var(--bdr)}
.tm::-webkit-scrollbar{height:10px}
.tm::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
.tm::-webkit-scrollbar-thumb:hover{background:var(--acc)}
.tw::-webkit-scrollbar{height:6px}
.tw::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--navy-bdr);background:var(--navy2);white-space:nowrap}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--bdr);white-space:nowrap;color:var(--txt)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surf2)}
tfoot td{background:var(--surf2);font-weight:700;border-top:2px solid var(--bdr2);color:var(--txt)}
/* BADGE */
.bdg{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
/* BTN */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r2);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;border:none;font-family:'Roboto Condensed',sans-serif;white-space:nowrap}
.btn:active{transform:scale(.97)}
.bp{background:var(--acc);color:#fff}.bp:hover{background:var(--acc2)}
.bs{background:var(--surf2);color:var(--txt);border:1px solid var(--bdr)}.bs:hover{border-color:var(--acc);color:var(--acc)}
.bg{background:var(--grn);color:#fff}
.bd{background:var(--red);color:#fff}
.bsm{padding:5px 11px;font-size:12px}
/* MODAL DEL ANIMATION */
@keyframes delPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
/* MODO TV */
#tv-overlay{display:none;position:fixed;inset:0;z-index:99999;background:#0a0f1e;color:#fff;font-family:'Roboto Condensed',sans-serif;overflow:hidden}
#tv-overlay.active{display:flex;flex-direction:column}
.tv-header{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:2px solid rgba(249,115,22,.3);background:rgba(15,31,69,.9);flex-shrink:0}
.tv-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:.5px}
.tv-clock{font-size:28px;font-weight:300;color:#f97316;letter-spacing:2px;font-variant-numeric:tabular-nums}
.tv-date{font-size:12px;color:#7a90c0;margin-top:2px;text-align:right}
.tv-body{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px 32px;overflow-y:auto;overflow-x:hidden}
.tv-kpi{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;min-height:64px;flex-shrink:0}
.tv-kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
.tv-kpi-val{font-size:28px;font-weight:900;line-height:1;letter-spacing:-1px}
.tv-kpi-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:4px;opacity:.6}
.tv-kpi-sub{font-size:9px;opacity:.4;margin-top:2px}
.tv-kpis-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex-shrink:0}.tv-gauges{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;flex-shrink:0}
.tv-gauge{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.tv-gauge-ring{position:relative;width:42px;height:42px;flex-shrink:0}
.tv-gauge-ring svg{transform:rotate(-90deg)}
.tv-gauge-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.tv-gauge-info{flex:1}
.tv-gauge-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
.tv-gauge-meta{font-size:9px;opacity:.4;margin-top:1px}
.tv-gauge-status{font-size:9px;font-weight:700;margin-top:3px;padding:1px 6px;border-radius:20px;display:inline-block}
.tv-list{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0}
.tv-stats-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
.tv-stat-block{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tv-list-header{padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#f97316;display:flex;align-items:center;gap:8px;flex-shrink:0}
.tv-list-body{flex:1;overflow:hidden}
.tv-list-row{display:grid;grid-template-columns:160px 1fr 140px 120px 80px;gap:12px;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;align-items:center}
.tv-list-row:last-child{border-bottom:none}
.tv-list-row:nth-child(even){background:rgba(255,255,255,.02)}
.tv-exit{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:8px 18px;font-family:'Roboto Condensed',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.tv-exit:hover{border-color:#ef4444;color:#ef4444}
/* INPUT */
.inp{width:100%;background:#0a1628;border:1.5px solid #2a4a70;border-radius:var(--r2);padding:9px 12px;color:#e2e8f0;font-family:'Roboto Condensed',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:var(--mut)}
html[data-mode="light"] .inp{background:#f8faff;border-color:#b0c4de;color:#0d1829}
html[data-mode="light"] select.inp{background:#f8faff;color:#0d1829}
html[data-mode="light"] .inp::placeholder{color:#9aabbf}
select.inp{background:#0a1628;color:#e2e8f0;cursor:pointer}
textarea.inp{resize:vertical;min-height:70px}

.inp:focus{border-color:var(--acc)}
.insm{padding:7px 11px;font-size:12px;width:auto}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:76px;line-height:1.5}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* MODAL */
.mov{position:fixed;inset:0;background:rgba(15,31,69,.65);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(5px)}
.mox{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:28px 32px;width:720px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 40px 80px rgba(0,0,0,.35)}
.mt{font-size:19px;font-weight:800;margin-bottom:20px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg.full{grid-column:1/-1}
.fg label{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.mac{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;padding-top:18px;border-top:1px solid var(--bdr)}
/* COMMENTS */
.cs{margin-top:22px;padding-top:18px;border-top:1px solid var(--bdr)}
.cmt{background:#f0f4ff;border-radius:8px;padding:11px 13px;margin-bottom:8px;border-left:3px solid var(--acc)}
.cma{font-size:11px;color:var(--mut);margin-bottom:3px}
.cmx{font-size:13px;line-height:1.5}
.cir{display:flex;gap:8px;margin-top:10px}
/* MISC */
.emp{text-align:center;padding:52px 20px;color:var(--mut)}
.ra{background:rgba(239,68,68,.1);color:#dc2626}
.rl{background:rgba(249,115,22,.1);color:#ea6c0a}
.rt{background:rgba(59,130,246,.1);color:#2563eb}
.rau{background:rgba(139,92,246,.1);color:#7c3aed}
@keyframes pd{0%,100%{box-shadow:0 0 0 3px rgba(239,68,68,.25)}50%{box-shadow:0 0 0 7px rgba(239,68,68,.08)}}

/* ══ PWA / MOBILE — hambúrguer, sidebar off-canvas, overlay ══ */
.ham-btn{display:none;background:var(--navy2);border:1px solid var(--navy-bdr);color:var(--navy-txt);border-radius:8px;padding:6px 12px;font-size:18px;cursor:pointer;flex-shrink:0}
.sb-ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299;opacity:0;pointer-events:none;transition:opacity .25s}
.sb-ovl.open{opacity:1;pointer-events:auto}

@media (max-width:860px){
  html{-webkit-text-size-adjust:100%}
  #app{display:block}
  .ham-btn{display:inline-block}
  .sb{position:fixed;top:0;left:0;height:100vh;z-index:300;transform:translateX(-100%);transition:transform .25s ease;width:260px;box-shadow:4px 0 24px rgba(0,0,0,.4)}
  .sb.open{transform:translateX(0)}
  .sb-ovl{display:block}
  .main{width:100%;min-height:100vh}
  .topbar{padding:12px 14px;flex-wrap:wrap;gap:8px}
  .tbt{font-size:15px}
  .tbm{display:none}
  .pc{padding:12px!important}
  /* Formulários e cards em coluna única */
  .fg2{grid-template-columns:1fr!important}
  .card{border-radius:12px}
  /* Botões e campos com alvo de toque maior */
  button,.btn,.inp,select,input,.ni{min-height:40px}
  .btn,button{font-size:14px}
  /* Modais ocupam a tela inteira no celular */
  .mov{padding:0}
  .mox{width:100%!important;max-width:100%!important;height:100%;max-height:100%;border-radius:0;overflow-y:auto}
  /* Tabelas: garante rolagem horizontal suave por toque */
  .tw{-webkit-overflow-scrolling:touch;max-height:calc(100vh - 220px)}
  table{font-size:12.5px}
  /* Login em tela cheia */
  .lc{width:92vw;max-width:420px;padding:32px 24px}
  /* KPIs e grids que normalmente ficam em várias colunas viram 1-2 colunas */
  [style*="grid-template-columns:repeat(4"],[style*="grid-template-columns: repeat(4"]{grid-template-columns:repeat(2,1fr)!important}
  [style*="grid-template-columns:repeat(3"],[style*="grid-template-columns: repeat(3"]{grid-template-columns:repeat(2,1fr)!important}
  #notif-panel{width:min(340px,88vw)!important;right:-8px!important}
}
@media (max-width:480px){
  .lc{padding:26px 18px}
  .lb-title{font-size:30px!important}
  [style*="grid-template-columns:repeat(2"],[style*="grid-template-columns: repeat(2"]{grid-template-columns:1fr!important}
}
/* Área segura em iPhones com notch, quando instalado como app */
@supports (padding:max(0px)){
  .sb-foot{padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .topbar{padding-top:max(16px,env(safe-area-inset-top))}
}
</style>
</head>
<body>

// Rastreia quais tabelas já tiveram uma busca CONFIRMADA (bem-sucedida) no
// Supabase nesta sessão — mesmo que tenham vindo vazias. Isso é usado como
// trava de segurança em _sendSheet: nunca apagar (DELETE) uma tabela no
// Supabase com base num array local vazio se ainda não temos confirmação
// de que esse "vazio" é real (e não apenas uma falha de carregamento).
const _loadedTables = {};

// fetch com tempo limite — evita que uma requisição travada (sem sucesso nem
// erro) deixe a sincronização "pendurada" pra sempre, sem nunca avisar o
// usuário que algo deu errado. Depois de 30s sem resposta, desiste e trata
// como falha (assim o indicador sempre resolve pra "Salvo" ou "Falha").
async function _fetchComTimeout(url, options, timeoutMs){
  timeoutMs = timeoutMs || 30000;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    return await fetch(url, {...options, signal: ctrl.signal});
  }catch(e){
    if(e.name === 'AbortError'){
      throw new Error('Tempo limite excedido ('+(timeoutMs/1000)+'s) ao conectar com o Supabase — conexão travada ou muito lenta.');
    }
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

// Upsert de uma tabela inteira no Supabase
// Estratégia: DELETE todos os registros e INSERT os novos, em LOTES (chunks).
// Enviar tudo de uma vez numa tabela grande (ex: PARADAS_DATA vindo de CSV de
// alarmes, que pode ter centenas/milhares de linhas) pode estourar o limite
// de tamanho de payload do Supabase e falhar. Por isso o INSERT é dividido
// em lotes menores (CHUNK_SIZE linhas por requisição).
// Se o DELETE falhar, ABORTA (não insere), pois inserir sem limpar antes
// é a causa raiz de registros duplicados.
const _SB_CHUNK_SIZE = 300;
async function _sendSheet(name, data){
  const table = SB_TABLES[name];
  if(!table) return;
  const base = SB_URL + '/rest/v1/' + table;

  // ── TRAVA DE SEGURANÇA ──
  // Se os dados locais estão vazios E ainda não confirmamos (nesta sessão)
  // que essa tabela foi carregada com sucesso do Supabase, NÃO mexe nela.
  // Isso evita apagar dados reais no banco por causa de um array local
  // vazio por falha de carregamento (e não porque o usuário realmente
  // apagou tudo).
  if((!data || data.length === 0) && !_loadedTables[name]){
    console.warn('[Supabase] Save de '+table+' IGNORADO por segurança: dados locais vazios e a tabela ainda não foi confirmada como carregada nesta sessão. (Se a tabela realmente estiver vazia no banco, isso é esperado; se não, pode ser um problema de carregamento — recarregue a página.)');
    return {skipped:true};
  }

  // 1) Apaga todos os registros da tabela
  const delRes = await _fetchComTimeout(base + '?_row=gte.0', { method:'DELETE', headers:_sbHeaders({'Prefer':'return=minimal'}) })
    .catch(e=>{ console.error('[Supabase] Erro de rede ao limpar tabela '+table, e); return null; });
  // Se o DELETE não respondeu OK, aborta para não duplicar dados.
  if(!delRes || !delRes.ok){
    let detalhe = '';
    if(delRes) detalhe = await delRes.text().catch(()=>'');
    console.error('[Supabase] Falha ao limpar tabela '+table+' (status '+(delRes?delRes.status:'sem resposta')+'): '+detalhe);
    throw new Error('Falha ao limpar tabela '+table+' antes de salvar — save abortado para evitar duplicação');
  }

  if(!data || data.length === 0) return;

  // 2) Normaliza os objetos: todos devem ter exatamente as mesmas chaves
  // Coleta todas as chaves únicas de todos os registros
  const allKeys = Array.from(new Set(data.flatMap(item => Object.keys(item))));

  const rows = data.map((item, idx) => {
    const r = { _row: idx };
    allKeys.forEach(k => {
      const v = (k in item) ? item[k] : null;
      r[k] = (Array.isArray(v) || (v !== null && typeof v === 'object')) ? JSON.stringify(v) : (v === undefined ? null : v);
    });
    return r;
  });

  // 3) Insere em lotes (chunks) para não estourar o limite de payload do Supabase
  for(let i=0; i<rows.length; i+=_SB_CHUNK_SIZE){
    const chunk = rows.slice(i, i+_SB_CHUNK_SIZE);
    const insRes = await _fetchComTimeout(base, {
      method:  'POST',
      headers: _sbHeaders({'Prefer':'return=minimal'}),
      body:    JSON.stringify(chunk),
    }).catch(e=>{ console.error('[Supabase] Erro de rede ao inserir lote em '+table, e); return null; });
    if(!insRes || !insRes.ok){
      let detalhe = '';
      if(insRes) detalhe = await insRes.text().catch(()=>'');
      console.error('[Supabase] Falha ao inserir lote ('+chunk.length+' linhas, itens '+i+'-'+(i+chunk.length-1)+') em '+table+' (status '+(insRes?insRes.status:'sem resposta')+'): '+detalhe);
      throw new Error('Falha ao inserir dados em '+table+' (lote '+i+')');
    }
  }
}

// Sincronização das Paradas de Linha: SOMENTE INSERÇÃO, nunca apaga.
// Diferente de _sendSheet (usado pelas outras tabelas), aqui só enviamos as
// linhas NOVAS de uma importação, com "Prefer: resolution=ignore-duplicates"
// (que usa a constraint UNIQUE em "_key" no banco) para o próprio Postgres
// ignorar qualquer duplicata com segurança — mesmo que duas pessoas
// importem CSVs com alarmes repetidos ao mesmo tempo, ninguém apaga o
// trabalho de ninguém.
async function _syncParadasNovas(novasRows){
  if(!novasRows || novasRows.length===0) return {ok:true};
  const table = SB_TABLES['PARADAS_DATA'];
  const base = SB_URL + '/rest/v1/' + table;
  const rows = novasRows.map((item, idx) => ({...item, _row: (PARADAS_DATA.length - novasRows.length) + idx}));
  try{
    for(let i=0; i<rows.length; i+=_SB_CHUNK_SIZE){
      const chunk = rows.slice(i, i+_SB_CHUNK_SIZE);
      const insRes = await _fetchComTimeout(base, {
        method:  'POST',
        headers: _sbHeaders({'Prefer':'resolution=ignore-duplicates,return=minimal'}),
        body:    JSON.stringify(chunk),
      }).catch(e=>{ console.error('[Supabase] Erro de rede ao inserir novas paradas', e); return null; });
      if(!insRes || !insRes.ok){
        let detalhe = '';
        if(insRes) detalhe = await insRes.text().catch(()=>'');
        console.error('[Supabase] Falha ao inserir novas paradas (lote '+i+', status '+(insRes?insRes.status:'sem resposta')+'): '+detalhe);
        return {ok:false};
      }
    }
    _loadedTables['PARADAS_DATA'] = true;
    _saveLocal();
    return {ok:true};
  }catch(e){
    console.error('[Supabase] Erro ao sincronizar novas paradas', e);
    return {ok:false};
  }
}

// ══ Sincronização de OS_DATA — POR DIFERENÇA (nunca apaga a tabela inteira) ══
// Em vez de DELETE tudo + INSERT tudo (que já causou perda de dados de verdade
// quando o array local ficou vazio por engano), aqui comparamos o estado atual
// do OS_DATA com a última "foto" confirmada do Supabase (_osSyncSnapshot) e só
// enviamos o que realmente mudou:
//   - Novas OS / OS editadas → UPSERT (insere ou atualiza pelo "id", nunca apaga nada)
//   - OS removidas localmente → DELETE só dessas, pelo "id" específico
// Requer uma constraint UNIQUE na coluna "id" de pcm_os_data (ver SQL abaixo).
let _osSyncSnapshot = new Map(); // id da OS -> JSON da última versão confirmada no Supabase
let _eqSyncSnapshot = new Map(); // tag do equipamento -> JSON da última versão confirmada no Supabase
let _estSyncSnapshot = new Map(); // código do item de estoque -> JSON da última versão confirmada no Supabase
let _cuSyncSnapshot = new Map(); // id do lançamento de custo -> JSON da última versão confirmada no Supabase
// Guarda, por tabela, o instante (Date.now()) da última alteração local pendente de salvar.
// Usado para blindar contra uma corrida rara: a leitura periódica do Supabase começa ANTES
// de uma edição local (ex: cadastrar um item de estoque), mas só termina DEPOIS — sem essa
// proteção, ela sobrescreveria a memória com o estado antigo (de antes da edição), fazendo
// a novidade "sumir" mesmo sem nenhum erro, porque o próprio salvamento seguinte não teria
// mais nada de diferente pra enviar (a edição já tinha sido apagada da memória).
let _localWriteAt = {};

// Sincronização genérica "por diferença" — usada tanto por OS_DATA (chave "id")
// quanto por EQUIPAMENTOS (chave "tag"). Nunca apaga a tabela inteira: só
// envia upsert do que mudou e delete pontual do que foi removido localmente.
async function _syncPorDiferenca(nomeTabela, arrLocal, chave, snapshotAtual, setSnapshot){
  const table = SB_TABLES[nomeTabela];
  const base = SB_URL + '/rest/v1/' + table;

  // Aviso defensivo: se dois registros locais tiverem a mesma chave (ex: dois
  // itens de estoque com o mesmo "cod"), só um deles seria sincronizado e o
  // outro pode "sumir" no próximo recarregamento — melhor avisar no console
  // imediatamente do que descobrir isso só quando o dado já tiver sumido.
  const chavesVistas = new Set();
  arrLocal.forEach(o=>{
    const k=o[chave];
    if(chavesVistas.has(k)) console.error('[Supabase] ATENÇÃO — dois registros locais em '+nomeTabela+' com a mesma chave ("'+chave+'"="'+k+'"). Só um deles vai sobreviver na próxima sincronização.');
    chavesVistas.add(k);
  });

  const atual = new Map(arrLocal.map(o=>[o[chave], JSON.stringify(o)]));

  if(atual.size===0 && !_loadedTables[nomeTabela]){
    console.warn('[Supabase] Save de '+table+' IGNORADO por segurança: dados locais vazios e a tabela ainda não foi confirmada como carregada nesta sessão.');
    return {skipped:true};
  }

  const paraSalvar = [];
  atual.forEach((json,k)=>{ if(snapshotAtual.get(k) !== json) paraSalvar.push(k); });
  const paraApagar = [];
  snapshotAtual.forEach((_json,k)=>{ if(!atual.has(k)) paraApagar.push(k); });

  if(paraSalvar.length===0 && paraApagar.length===0) return; // nada mudou desde o último sync

  try{
    // 1) Apaga SOMENTE os registros removidos localmente (nunca a tabela inteira)
    for(let i=0;i<paraApagar.length;i+=100){
      const chunk = paraApagar.slice(i,i+100);
      const filtro = chunk.map(k=>encodeURIComponent('"'+String(k).replace(/"/g,'\\"')+'"')).join(',');
      const res = await _fetchComTimeout(base+'?'+chave+'=in.('+filtro+')', { method:'DELETE', headers:_sbHeaders({'Prefer':'return=minimal'}) })
        .catch(e=>{ console.error('[Supabase] Erro de rede ao apagar em '+table, e); return null; });
      if(!res || !res.ok){
        const detalhe = res ? await res.text().catch(()=>'') : '';
        console.error('[Supabase] Falha ao apagar (lote '+i+', status '+(res?res.status:'sem resposta')+') em '+table+': '+detalhe);
        throw new Error('Falha ao apagar em '+table);
      }
    }

    // 2) Upsert dos registros novos/alterados — nunca mexe nos que não mudaram
    if(paraSalvar.length>0){
      const rows = paraSalvar.map(k=>{
        const item = arrLocal.find(o=>o[chave]===k);
        const r = {...item, _row: arrLocal.indexOf(item)};
        Object.keys(r).forEach(kk=>{
          const v=r[kk];
          if(Array.isArray(v) || (v!==null && typeof v==='object')) r[kk]=JSON.stringify(v);
        });
        return r;
      });
      for(let i=0;i<rows.length;i+=_SB_CHUNK_SIZE){
        const chunk = rows.slice(i,i+_SB_CHUNK_SIZE);
        const res = await _fetchComTimeout(base+'?on_conflict='+chave, {
          method:'POST',
          headers:_sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
          body:JSON.stringify(chunk),
        }).catch(e=>{ console.error('[Supabase] Erro de rede ao salvar em '+table, e); return null; });
        if(!res || !res.ok){
          const detalhe = res ? await res.text().catch(()=>'') : '';
          console.error('[Supabase] Falha ao salvar (lote '+i+', status '+(res?res.status:'sem resposta')+') em '+table+': '+detalhe);
          throw new Error('Falha ao salvar em '+table);
        }
      }
    }

    setSnapshot(atual); // sucesso — atualiza a baseline
    _loadedTables[nomeTabela] = true;
  }catch(e){
    console.error('[Supabase] Erro ao sincronizar '+nomeTabela, e);
    throw e;
  }
}
// Garante que TODAS as OS tenham exatamente o mesmo conjunto de chaves antes de
// sincronizar. Sem isso, se um campo novo (ex: pecasUsadas) só existir em parte
// dos registros — porque foi adicionado ao sistema depois que outras OS já
// existiam — o Supabase recusa o lote inteiro com "All object keys must match"
// (PGRST102) assim que uma OS antiga e uma nova forem salvas juntas.
function _normalizarChavesOS(){
  const chaves = new Set();
  OS_DATA.forEach(o=>Object.keys(o).forEach(k=>chaves.add(k)));
  const listaVazia = new Set(['pecasUsadas','comentarios']);
  OS_DATA.forEach(o=>{
    chaves.forEach(k=>{
      if(!(k in o)) o[k] = listaVazia.has(k) ? [] : null;
    });
  });
}
async function _syncOSData(){
  _normalizarChavesOS();
  return _syncPorDiferenca('OS_DATA', OS_DATA, 'id', _osSyncSnapshot, m=>{_osSyncSnapshot=m;});
}
async function _syncEquipamentos(){
  return _syncPorDiferenca('EQUIPAMENTOS', EQUIPAMENTOS, 'tag', _eqSyncSnapshot, m=>{_eqSyncSnapshot=m;});
}
// Remove o campo "max" (Qtd. Máxima) de todo item — esse campo foi retirado do
// sistema. Itens antigos que ainda tenham essa coluna preenchida no Supabase
// continuam chegando com ela ao carregar; sem essa limpeza, parte dos itens
// ficaria com a chave "max" e parte sem, recriando o mesmo erro de "chaves
// diferentes" (PGRST102) já visto antes com o campo pecasUsadas.
function _normalizarEstoque(){
  ESTOQUE.forEach(e=>{ delete e.max; });
}
async function _syncEstoque(){
  _normalizarEstoque();
  return _syncPorDiferenca('ESTOQUE', ESTOQUE, 'cod', _estSyncSnapshot, m=>{_estSyncSnapshot=m;});
}
async function _syncCustos(){
  return _syncPorDiferenca('CUSTOS_DATA', CUSTOS_DATA, 'id', _cuSyncSnapshot, m=>{_cuSyncSnapshot=m;});
}

// saveAll — salva local E envia para o Supabase
// IMPORTANTE: as chamadas são SERIALIZADAS (uma fila) para evitar que dois
// saves concorrentes façam DELETE+INSERT entrelaçados no Supabase, o que
// causava duplicação de registros (ex: OSs duplicadas). Nunca chame
// _sendSheet diretamente fora desta fila.
let _saveChain = Promise.resolve();

// Versão "enfileirada" de loadSaved(): garante que uma leitura nunca rode ao
// mesmo tempo que um salvamento pendente (o que causava OS recém-criadas
// "sumirem" — a leitura periódica sobrescrevia a memória com dados antigos
// do Supabase antes do salvamento em fila conseguir enviar a novidade).
function loadSavedQueued(){
  _saveChain = _saveChain.then(loadSaved, loadSaved);
  return _saveChain;
}
function saveAll(){
  const agora = Date.now();
  ['USERS','OS_DATA','EQUIPAMENTOS','ESTOQUE','PLANO_PREV','CUSTOS_DATA'].forEach(t=>{ _localWriteAt[t] = agora; });
  _saveLocal();
  _ind('↻ Sincronizando...','#f97316',false);
  // Encadeia este save no final da fila atual, garantindo execução sequencial
  _saveChain = _saveChain.then(_runSave, _runSave);
  return _saveChain;
}
function _runSave(){
  // OBS: PARADAS_DATA, OS_DATA, EQUIPAMENTOS e ESTOQUE NÃO entram na lista
  // genérica de propósito. PARADAS_DATA usa fluxo "somente inserção"
  // (_syncParadasNovas); as outras quatro usam sincronização "por diferença"
  // (_syncPorDiferenca) — nenhuma delas mais apaga a tabela inteira a cada
  // save, evitando o cenário que já causou perda de dados real: um array
  // local vazio (por bug ou falha de rede) sendo usado pra "apagar tudo e
  // reinserir" no Supabase.
  const tasks=[
    ['USERS',       USERS],
    ['PLANO_PREV',  PLANO_PREV],
  ];
  const nomes = [...tasks.map(t=>t[0]), 'OS_DATA', 'EQUIPAMENTOS', 'ESTOQUE', 'CUSTOS_DATA'];
  const promessas = [...tasks.map(([name,data])=>_sendSheet(name,data)), _syncOSData(), _syncEquipamentos(), _syncEstoque(), _syncCustos()];
  return Promise.allSettled(promessas)
    .then(results=>{
      const falhas = results
        .map((r,i)=>({name:nomes[i], ok:r.status==='fulfilled', reason:r.reason}))
        .filter(x=>!x.ok);
      const puladas = results
        .map((r,i)=>({name:nomes[i], skipped: r.status==='fulfilled' && r.value && r.value.skipped}))
        .filter(x=>x.skipped)
        .map(x=>x.name);
      if(falhas.length===0 && puladas.length===0){
        _ind('✓ Salvo','#22c55e',true);
        return {ok:true};
      }else if(falhas.length===0){
        // Nada "falhou" tecnicamente, mas uma ou mais tabelas foram puladas
        // pela trava de segurança (array local vazio e ainda não confirmado)
        // — isso NÃO pode aparecer como "Salvo", senão mudanças (como uma
        // exclusão em massa) parecem ter sido salvas sem terem sido de verdade.
        console.warn('[Supabase] Tabelas puladas por segurança (não sincronizadas de propósito, recarregue a página se isso não era esperado):', puladas.join(', '));
        _ind('⚠ Não sincronizado: '+puladas.join(', ')+' — recarregue a página','#f59e0b',false);
        return {ok:false, puladas};
      }else{
        console.error('[Supabase] Tabelas que NÃO sincronizaram (dados ficaram só no localStorage):', falhas.map(f=>f.name).join(', '));
        falhas.forEach(f=>console.error('  → '+f.name+': '+(f.reason&&f.reason.message?f.reason.message:f.reason)));
        _ind('⚠ Falha ao salvar: '+falhas.map(f=>f.name).join(', '),'#ef4444',false);
        return {ok:false, falhas:falhas.map(f=>f.name)};
      }
    });
}

// Carrega dados do Supabase; fallback para localStorage
let _paradasLoadFailed = false; // true se a última tentativa de buscar PARADAS_DATA no Supabase falhou

async function loadSaved(){
  const fetchStartedAt = Date.now();
  const h = _sbHeaders();

  // Busca TODAS as linhas de uma tabela, paginando de 1000 em 1000.
  // O Supabase/PostgREST limita cada resposta a no máximo 1000 linhas por
  // padrão — sem isso, tabelas que crescem com o tempo (paradas, OS antigas
  // etc.) passariam a perder silenciosamente tudo que estiver depois da
  // linha 1000, sem nenhum aviso.
  async function _fetchAllRows(tableName){
    const pageSize = 1000;
    let offset = 0, all = [];
    while(true){
      const url = SB_URL + '/rest/v1/' + tableName + '?order=_row.asc&limit=' + pageSize + '&offset=' + offset;
      const res = await _fetchComTimeout(url, { headers: h });
      if(!res.ok){
        const detalhe = await res.text().catch(()=>'');
        throw new Error('status ' + res.status + ': ' + detalhe);
      }
      const page = await res.json();
      all = all.concat(page);
      if(page.length < pageSize) break; // última página (veio menos que o tamanho pedido)
      offset += pageSize;
    }
    return all;
  }

  // Busca todas as tabelas em paralelo
  const tableMap = [
    ['USERS',        USERS],
    ['OS_DATA',      OS_DATA],
    ['EQUIPAMENTOS', EQUIPAMENTOS],
    ['ESTOQUE',      ESTOQUE],
    ['PLANO_PREV',   PLANO_PREV],
    ['CUSTOS_DATA',  CUSTOS_DATA],
    ['PARADAS_DATA', PARADAS_DATA],
  ];

  // Função para desserializar campos que foram armazenados como JSON string
  function pr(row){
    const r = {...row};
    delete r._row; // remove coluna de controle interno
    Object.keys(r).forEach(k => {
      const v = r[k];
      if(typeof v === 'string' && v !== ''){
        if(v === 'true')  { r[k] = true;  return; }
        if(v === 'false') { r[k] = false; return; }
        if(!isNaN(v) && v.trim() !== '') { r[k] = Number(v); return; }
        if(v.startsWith('[') || v.startsWith('{')) {
          try { r[k] = JSON.parse(v); } catch(e) {}
        }
      }
    });
    return r;
  }

  try {
    const results = await Promise.all(
      tableMap.map(([name]) =>
        _fetchAllRows(SB_TABLES[name])
          .catch(e => {
            console.error('[Supabase] Falha ao CARREGAR a tabela '+name+' ('+SB_TABLES[name]+'): '+e.message);
            return null; // null = falha real (diferente de "tabela vazia")
          })
      )
    );

    let anyLoaded = false;
    const falhas = [];
    _paradasLoadFailed = false;
    tableMap.forEach(([name, arr], i) => {
      const rows = results[i];
      if(rows === null){
        // Falha real na busca: NÃO sobrescreve o array local (evita mostrar "vazio" por engano)
        // e NÃO marca como carregada (mantém a trava de segurança ativa em _sendSheet).
        falhas.push(name);
        if(name==='PARADAS_DATA') _paradasLoadFailed = true;
        return;
      }
      // Proteção contra corrida: se essa tabela foi alterada localmente DEPOIS que esta busca
      // começou, os dados que acabaram de chegar já estão desatualizados em relação à edição
      // — aplicá-los agora apagaria a novidade sem deixar rastro nenhum de erro. Pula esta
      // tabela nesta rodada; o próprio salvamento encadeado logo em seguida (ou a próxima
      // sincronização periódica) vai reconciliar tudo corretamente.
      if(_localWriteAt[name] && _localWriteAt[name] > fetchStartedAt){
        console.warn('[Supabase] Leitura de '+name+' ignorada nesta rodada: havia uma alteração local mais recente que esta busca (evita perder a novidade).');
        return;
      }
      // Busca respondeu OK — isso é o estado REAL da tabela no Supabase.
      //
      // Para OS_DATA, EQUIPAMENTOS e ESTOQUE (que usam sincronização "por
      // diferença", nunca "apaga tudo e reinsere"), é seguro esvaziar o
      // array local quando o Supabase confirma que a tabela está vazia —
      // diferente do modelo antigo, aqui isso NUNCA aciona uma exclusão em
      // massa sozinho, só reflete o estado real na tela (evita "dados
      // fantasma" de exemplo aparecendo à toa quando a tabela está vazia
      // de verdade).
      //
      // Para as demais tabelas (ainda no modelo antigo de save), mantém o
      // comportamento conservador: só sobrescreve se vierem dados de
      // verdade — nunca esvazia sozinho.
      const tabelasSeguras = ['OS_DATA','EQUIPAMENTOS','ESTOQUE','CUSTOS_DATA'];
      _loadedTables[name] = true;
      if(Array.isArray(rows)){
        if(name==='OS_DATA'){
          // A baseline de diff (_osSyncSnapshot) reflete sempre o que o
          // Supabase realmente respondeu, independente de aplicarmos ou não
          // ao array local — é a "última foto confirmada" usada pra saber
          // o que mudou no próximo save.
          _osSyncSnapshot = new Map(rows.map(r=>{ const o=pr(r); return [o.id, JSON.stringify(o)]; }));
        }
        if(name==='EQUIPAMENTOS'){
          _eqSyncSnapshot = new Map(rows.map(r=>{ const o=pr(r); return [o.tag, JSON.stringify(o)]; }));
        }
        if(name==='ESTOQUE'){
          _estSyncSnapshot = new Map(rows.map(r=>{ const o=pr(r); return [o.cod, JSON.stringify(o)]; }));
        }
        if(name==='CUSTOS_DATA'){
          _cuSyncSnapshot = new Map(rows.filter(r=>r.id).map(r=>{ const o=pr(r); return [o.id, JSON.stringify(o)]; }));
        }
        if(rows.length > 0){
          arr.splice(0, arr.length, ...rows.map(pr));
          anyLoaded = true;
        }else if(tabelasSeguras.includes(name)){
          arr.splice(0, arr.length);
          anyLoaded = true;
        }
        // Demais tabelas: se rows.length===0, não mexe no array local.
      }
    });

    if(falhas.length>0){
      console.error('[Supabase] ATENÇÃO — tabelas que falharam ao carregar (dados podem estar desatualizados/incompletos na tela): '+falhas.join(', '));
    }

    _normalizarChavesOS();
    _normalizarEstoque();
    if(anyLoaded) _saveLocal(); // atualiza cache local

  } catch(e) {
    console.error('[Supabase] Falha geral ao carregar dados salvos, usando cache local', e);
    _loadLocal(); // usa cache local se Supabase falhar
  }
}

// Carrega imediatamente (síncrono do local para não travar)
_loadLocal();
_normalizarChavesOS();
_normalizarEstoque();

let currentUser=null,currentPage='dashboard',charts={};
const ACCESS={administrador:['dashboard','os','equipamentos','preventivo','estoque','custos','indicadores','paradas','usuarios'],lider:['dashboard','os','equipamentos','preventivo','estoque','custos','indicadores','paradas'],tecnico:['dashboard','os','equipamentos','preventivo','estoque','paradas'],auxiliar:['dashboard','os','equipamentos','preventivo','estoque','paradas']};
const NAV=[{k:'dashboard',i:'🖥️',l:'Dashboard'},{k:'os',i:'🔧',l:'Ordens de Serviço'},{k:'equipamentos',i:'⚙️',l:'Equipamentos'},{k:'preventivo',i:'📅',l:'Plano Preventivo'},{k:'estoque',i:'📦',l:'Estoque'},{k:'custos',i:'💰',l:'Custos'},{k:'indicadores',i:'📊',l:'Indicadores KPI'},{k:'paradas',i:'🛑',l:'Paradas de Linha'},{k:'usuarios',i:'👥',l:'Usuários'}];

// ══ HELPERS ══
const R=id=>document.getElementById(id);

// Debounce genérico — atrasa a execução até a pessoa parar de digitar,
// evitando redesenhar a tabela inteira a cada tecla.
function _debounce(fn, delay){
  let t;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(()=>fn.apply(this,args), delay);
  };
}
// As buscas reconstroem o card inteiro (incluindo o próprio campo de texto),
// então sem isso o cursor "pula" pra fora do campo a cada letra digitada.
// Aqui a gente guarda o foco/posição do cursor antes de redesenhar e
// restaura logo em seguida, no mesmo elemento (mesmo id).
function _rerenderPreservandoFoco(renderFn){
  const el = document.activeElement;
  const id = el && el.id;
  const selStart = el && typeof el.selectionStart==='number' ? el.selectionStart : null;
  const selEnd = el && typeof el.selectionEnd==='number' ? el.selectionEnd : null;
  renderFn();
  if(id){
    const novo = R(id);
    if(novo && typeof novo.focus==='function'){

// Horas de calendário de um período (usado como base do cálculo de MTBF).
// Se 'mes' for informado (1-12), retorna as horas daquele mês; senão, do ano inteiro.
function _horasNoPeriodo(ano, mes){
  if(mes){ const dias = new Date(ano, mes, 0).getDate(); return dias*24; }
  const bissexto = (ano%4===0 && (ano%100!==0 || ano%400===0));
  return (bissexto?366:365)*24;
}

// ══ MTBF e Disponibilidade baseados no histórico real de paradas dos Equipamentos ══
// Um equipamento "para de operar" (evento de falha) sempre que o status dele
// muda para "Parado" ou "Em Manutenção"; volta a contar quando volta pra
// "Operando". Isso é registrado em tempo real em _registrarMudancaStatusEQ(),
// e também quando uma OS é concluída com "esteira parada = Sim".
function _periodoRange(ano, mes){
  const inicio = mes ? new Date(ano, mes-1, 1) : new Date(ano,0,1);
  const fimTeorico = mes ? new Date(ano, mes, 1) : new Date(ano+1,0,1); // exclusivo
  const agora = new Date();
  const fim = fimTeorico < agora ? fimTeorico : agora;
  return {inicio, fim};
}
// Calcula MTBF e Disponibilidade num único lugar, a partir do mesmo histórico
// de paradas — evita duas fórmulas divergentes e garante que os dois números
// sempre "batam" entre si.
// - MTBF: média do (tempo operando ÷ nº de falhas) de CADA equipamento que
//   teve pelo menos 1 falha no período, depois tirada a média entre eles.
//   (Calcular por equipamento, em vez de somar a frota inteira antes de
//   dividir, evita que o número exploda conforme mais equipamentos são
//   cadastrados — o que sem essa correção gerava números como "32.000h".)
// - Disponibilidade: % do tempo total da frota em que os equipamentos
//   ficaram operando (não parados), no período. Essa conta é uma razão
//   simples (horas paradas ÷ horas totais da frota) e por isso não sofre do
//   mesmo problema de escala do MTBF.
function _calcIndicadoresEquip(ano, mes){
  if(!EQUIPAMENTOS || !EQUIPAMENTOS.length) return {mtbf:null, disponibilidade:null};
  const {inicio, fim} = _periodoRange(ano, mes);
  if(fim <= inicio) return {mtbf:null, disponibilidade:null}; // período totalmente no futuro
  const horasPeriodo = (fim - inicio) / 3600000;
  if(horasPeriodo<=0) return {mtbf:null, disponibilidade:null};

  let horasParadasTotais = 0;
  const mtbfPorEquip = [];

  EQUIPAMENTOS.forEach(eq=>{
    const paradas = (eq.historicoParadas||[]).map(h=>({inicio:new Date(h.inicio), fim: h.fim?new Date(h.fim):fim}));
    if(eq.paradaDesde) paradas.push({inicio:new Date(eq.paradaDesde), fim: fim});
    let horasParadasEquip = 0, nEventosEquip = 0;
    paradas.forEach(p=>{
      if(isNaN(p.inicio) || p.fim<=inicio || p.inicio>=fim) return; // fora do período
      const pInicio = p.inicio < inicio ? inicio : p.inicio;
      const pFim = p.fim > fim ? fim : p.fim;
      horasParadasEquip += Math.max(0,(pFim - pInicio)/3600000);
      if(p.inicio >= inicio && p.inicio < fim) nEventosEquip++; // conta como evento só se começou dentro do período
    });
    horasParadasTotais += horasParadasEquip;
    if(nEventosEquip>0){
      const horasOperando = Math.max(0, horasPeriodo - horasParadasEquip);
      mtbfPorEquip.push(horasOperando / nEventosEquip);
    }
  });

  const horasDisponiveisTotais = horasPeriodo * EQUIPAMENTOS.length;
  const disponibilidade = horasDisponiveisTotais>0
    ? Math.max(0, Math.min(100, ((horasDisponiveisTotais - horasParadasTotais) / horasDisponiveisTotais) * 100))
    : null;
  const mtbf = mtbfPorEquip.length>0
    ? mtbfPorEquip.reduce((a,b)=>a+b,0) / mtbfPorEquip.length
    : null;

  return {mtbf, disponibilidade};
}
// Mantida por compatibilidade com quem só precisa do MTBF isoladamente.
function _calcMTBFEquip(ano, mes){
  return _calcIndicadoresEquip(ano, mes).mtbf;
}
function fmtDuracaoParada(isoInicio){
  const ini = new Date(isoInicio);
  if(isNaN(ini)) return '';
  const seg = Math.max(0, Math.floor((Date.now()-ini.getTime())/1000));
  if(seg<3600) return Math.floor(seg/60)+'min';
  if(seg<86400) return Math.floor(seg/3600)+'h '+Math.floor((seg%3600)/60)+'min';
  return Math.floor(seg/86400)+'d '+Math.floor((seg%86400)/3600)+'h';
}
// Converte um ISO string para o formato exigido por <input type="datetime-local"> (yyyy-MM-ddTHH:mm)
function _isoParaDatetimeLocal(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
// Converte o valor de <input type="datetime-local"> de volta para ISO string
function _datetimeLocalParaIso(val){
  if(!val) return null;
  const d = new Date(val);
  return isNaN(d) ? null : d.toISOString();
}
// Formata um ISO string como "dd/mm/aaaa HH:mm" para exibição
function _fmtDataHora(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
// Converte "dd/mm/aaaa" + "HH:mm" (formato usado nas OS) para um objeto Date.
// Se faltar algum pedaço, usa a hora atual como resguardo.
function _parseDataHoraBR(dataStr, horaStr){
  if(!dataStr) return new Date();
  const [d,m,y] = dataStr.split('/').map(Number);
  if(!d || !m || !y) return new Date();
  let hh=0, mm=0;
  if(horaStr && horaStr.includes(':')){
    const [h,mi] = horaStr.split(':').map(Number);
    hh = h||0; mm = mi||0;
  }
  const dt = new Date(y, m-1, d, hh, mm);
  return isNaN(dt) ? new Date() : dt;
}

}

// Registra (ou atualiza/remove) no histórico de paradas do equipamento da OS
// o tempo em que a linha/esteira ficou parada durante o serviço, usando o HH
// Real informado na própria OS. Cada entrada é marcada com o id da OS que a
// gerou, então reabrir e re-salvar a mesma OS atualiza o registro em vez de
// duplicar — e se a resposta mudar de "Sim" pra "Não", o registro é removido.
function _sincronizarParadaEquipamentoPorOS(os){
  if(!os) return;
  const eq = EQUIPAMENTOS.find(e=>e.descricao===os.equipamento);
  if(!eq) return;
  if(!Array.isArray(eq.historicoParadas)) eq.historicoParadas=[];
  eq.historicoParadas = eq.historicoParadas.filter(h=>h.osId!==os.id);
  if(os.esteiraParada==='Sim' && os.hhReal>0){
    const fimRef = _parseDataHoraBR(os.dataConclusao, os.horaConclusao);
    const inicioRef = new Date(fimRef.getTime() - os.hhReal*3600000);
    eq.historicoParadas.push({
      inicio: inicioRef.toISOString(),
      fim: fimRef.toISOString(),
      motivo: 'Linha parada durante a OS '+os.id,
      osId: os.id
    });
  }
}
// Chamado sempre que o status de um equipamento é salvo (novo ou editado).
// Detecta a transição de status e abre/fecha o registro de parada.
function _registrarMudancaStatusEQ(eq, novoStatus){
  const paraParado = s => s==='Parado' || s==='Em Manutenção';
  const eraParado = paraParado(eq.status);
  const ficaParado = paraParado(novoStatus);
  const agora = new Date().toISOString();
  if(!eraParado && ficaParado){
    eq.paradaDesde = agora; // acabou de parar
  }else if(eraParado && !ficaParado){
    if(eq.paradaDesde){
      if(!Array.isArray(eq.historicoParadas)) eq.historicoParadas=[];
      eq.historicoParadas.push({inicio:eq.paradaDesde, fim:agora, motivo:eq.status});
    }
    eq.paradaDesde = null; // voltou a operar
  }
  // Se continuou parado (só trocou entre "Parado" ↔ "Em Manutenção"), mantém paradaDesde como está.
}
// Evolução ANUAL: totais de OS Abertas / Concluídas / Em Atraso, agrupados por ano
// (usado tanto no Dashboard quanto no Modo TV, no gráfico de Evolução).
function _evoAnual(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const anosSet = new Set();
  OS_DATA.forEach(o=>{ const y=_anoRefOS(o); if(y) anosSet.add(y); });
  const anos = [...anosSet].sort((a,b)=>a-b);
  const porAno = anos.map(y=>OS_DATA.filter(o=>_incluiOSNoPeriodo(o,y,null)));
  return {
    labels:  anos.map(String),
    abertas: porAno.map(arr=>arr.length),
    conc:    porAno.map(arr=>arr.filter(o=>o.status==='Concluída').length),
    atr:     porAno.map(arr=>arr.filter(o=>{
      const dp=_parseDt(o.dataPrevista);
      return dp && o.status!=='Concluída' && new Date(dp.ano,dp.mes-1,dp.dia)<hoje;
    }).length),
  };
}

// itens selecionados, se o foco está num campo de formulário/busca, ou

function _iniciarAutoSync(){
  clearInterval(window._syncInt);
  window._syncInt=setInterval(()=>{
    loadSavedQueued().then(()=>{
      const temSelecaoAtiva = Object.values(SEL).some(s=>s.size>0);
      const focoAtivo = document.activeElement;
      const dentroDoConteudo = focoAtivo && R('pc') && R('pc').contains(focoAtivo);
      const digitandoOuInteragindo = dentroDoConteudo && ['INPUT','SELECT','TEXTAREA'].includes(focoAtivo.tagName);

      const pc = R('pc');

function doLogin(){
  const d=R('dom').value.trim().toUpperCase(),u=R('usr').value.trim(),p=R('pwd').value.trim(),err=R('lerr');
  if(d!=='PCM'){err.textContent='Domínio inválido.';err.classList.remove('hide');return;}
  err.classList.add('hide');
  const btn=R('lbtn');btn.textContent='Carregando...';btn.disabled=true;
  loadSaved().then(()=>{

}

// clicar em "Sair do Sistema". Guardamos só o USUÁRIO no localStorage (nunca
// a senha) e revalidamos contra a lista de usuários a cada abertura.
(function _tentarAutoLogin(){
  let savedUsername;
  try{ savedUsername = localStorage.getItem('pcm_session'); }catch(e){ savedUsername = null; }
  if(!savedUsername) return;
  const btn=R('lbtn');
  if(btn){ btn.textContent='Entrando...'; btn.disabled=true; }
  function _entrarComoUsuarioSalvo(){
    const user = USERS.find(x=>x.username===savedUsername);
    if(btn){ btn.textContent='Entrar no Sistema'; btn.disabled=false; }
    if(!user) return false; // usuário não existe mais (ex: foi removido por um admin)
    currentUser=user;
    R('ls').classList.add('hide');R('app').classList.remove('hide');
    buildSB();updUser();nav('dashboard');
    _iniciarAutoSync();
    return true;
  }
  loadSaved().then(()=>{
    if(!_entrarComoUsuarioSalvo()) _limparSessao(); // usuário sumiu de verdade -> pede login de novo
  }).catch(()=>{
    // Sem rede/Supabase no momento: tenta com o cache local (não apaga a
    // sessão, pode ser só falta de conexão passageira).
    _entrarComoUsuarioSalvo();
  });
})();

// ══ NOTIFICAÇÕES — OS próximas do prazo e atrasadas ══
function _notifData(){
  const abertas = OS_DATA.filter(o=>o.status!=='Concluída' && o.dataPrevista);
  const atrasadas=[], proximas=[];
  abertas.forEach(o=>{
    const diff = _diffDiasHoje(o.dataPrevista);
    if(diff===null) return;
    if(diff<0) atrasadas.push({...o,_diff:diff});
    else if(diff<=3) proximas.push({...o,_diff:diff});
  });
  atrasadas.sort((a,b)=>a._diff-b._diff);
  proximas.sort((a,b)=>a._diff-b._diff);
  // OS atribuídas ao usuário logado — aparecem SOMENTE pra ele, independente de prazo,
  // e ficam fixadas até a OS ser concluída.
  const atribuidas = currentUser
    ? OS_DATA.filter(o=>o.atribuidoA===currentUser.username && o.status!=='Concluída')
    : [];
  // Remove das listas gerais as que já aparecem em "atribuídas" (evita duplicar o mesmo cartão)
  const atribIds = new Set(atribuidas.map(o=>o.id));
  return {
    atrasadas: atrasadas.filter(o=>!atribIds.has(o.id)),
    proximas: proximas.filter(o=>!atribIds.has(o.id)),
    atribuidas,
  };
}

// ══ DUAL SCROLL ══
function applyDS(){
  document.querySelectorAll('.tw').forEach(w=>{
    if(w.dataset.ds)return;w.dataset.ds='1';
    const m=document.createElement('div');m.className='tm';
    const mi=document.createElement('div');mi.style.cssText='height:1px;display:block;';
    m.appendChild(mi);w.parentNode.insertBefore(m,w);
    function sw(){mi.style.width=w.scrollWidth+'px';}sw();
    let lm=false,lw=false;
    m.addEventListener('scroll',()=>{if(lw)return;lm=true;w.scrollLeft=m.scrollLeft;lm=false;});
    w.addEventListener('scroll',()=>{if(lm)return;lw=true;m.scrollLeft=w.scrollLeft;lw=false;});
    new ResizeObserver(sw).observe(w);
  });

  // Scrollbar espelho no topo do conteúdo da página (dashboard, etc)
  const pc = document.getElementById('pc');
  if(pc && !pc.dataset.topScroll){
    pc.dataset.topScroll='1';
    // Cria barra espelho fixada no topo da área de conteúdo
    const topBar = document.createElement('div');
    topBar.id = 'pc-top-scroll';
    topBar.style.cssText = [
      'overflow-x:auto','overflow-y:hidden','height:10px',
      'background:var(--surf2)','border-bottom:1px solid var(--bdr)',
      'position:sticky','top:0','z-index:10','width:100%',
      'flex-shrink:0'
    ].join(';');
    const inner = document.createElement('div');
    inner.style.cssText = 'height:1px;display:block;';
    topBar.appendChild(inner);

    // Estilo da scrollbar
    if(!document.getElementById('top-scroll-style')){
      const st = document.createElement('style');
      st.id = 'top-scroll-style';
      st.textContent = `
        #pc-top-scroll::-webkit-scrollbar{height:10px}
        #pc-top-scroll::-webkit-scrollbar-track{background:var(--surf2)}
        #pc-top-scroll::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
        #pc-top-scroll::-webkit-scrollbar-thumb:hover{background:var(--acc)}
      `;
      document.head.appendChild(st);
    }

    // Insere ANTES do pc
    pc.parentNode.insertBefore(topBar, pc);

    // Sincroniza scroll
    function syncW(){ inner.style.width = pc.scrollWidth + 'px'; }
    syncW();
    let lt=false,lp=false;
    topBar.addEventListener('scroll',()=>{if(lp)return;lt=true;pc.scrollLeft=topBar.scrollLeft;lt=false;});
    pc.addEventListener('scroll',()=>{if(lt)return;lp=true;topBar.scrollLeft=pc.scrollLeft;lp=false;});

    // Adiciona overflow-x ao pc para rolar horizontalmente
    pc.style.overflowX = 'auto';

    new ResizeObserver(syncW).observe(pc);
  }
}

// ══ SELEÇÃO MÚLTIPLA (genérica) ══
// Cada lista tem seu próprio "namespace" (ex: 'os','eq','pm','est','cu','us')
// e guarda o conjunto de chaves selecionadas. A chave é o que identifica a
// linha de forma estável dentro do array filtrado/renderizado (id, ou índice
// real no array global quando não há id próprio).
const SEL = {os:new Set(),eq:new Set(),pm:new Set(),est:new Set(),cu:new Set(),us:new Set()};

function selToggle(ns,key){
  const s=SEL[ns];
  key=String(key);
  if(s.has(key))s.delete(key);else s.add(key);
  selRefreshBar(ns);
  selRefreshHeader(ns);
}
function selToggleAll(ns,keys,checked){
  const s=SEL[ns];
  if(checked) keys.forEach(k=>s.add(String(k)));
  else keys.forEach(k=>s.delete(String(k)));
  // Re-renderiza apenas os checkboxes de linha (sem perder filtros/scroll)
  document.querySelectorAll(`input.selRow[data-ns="${ns}"]`).forEach(cb=>{
    cb.checked = s.has(cb.dataset.key);
  });
  selRefreshBar(ns);
}
function selClear(ns){
  SEL[ns].clear();
  // Desmarcar visualmente todos os checkboxes de linha
  document.querySelectorAll(`input.selRow[data-ns="${ns}"]`).forEach(cb=>{ cb.checked=false; });
  const h=R('selAll_'+ns); if(h){ h.checked=false; h.indeterminate=false; }
  selRefreshBar(ns);
}
function selRefreshHeader(ns){
  const all=document.querySelectorAll(`input.selRow[data-ns="${ns}"]`);
  const head=R('selAll_'+ns);
  if(!head||!all.length)return;
  const checkedCount=Array.from(all).filter(cb=>cb.checked).length;
  head.checked = checkedCount===all.length;
  head.indeterminate = checkedCount>0 && checkedCount<all.length;
}
// Constrói (ou remove) a barra flutuante de ações em massa para o namespace.
// extraActions: array de {label, onClick} renderizados como botões extras (ex: mudar status).
function selRefreshBar(ns,extraActionsHtml){
  const s=SEL[ns];
  let bar=R('selbar_'+ns);
  if(s.size===0){ if(bar) bar.remove(); return; }
  const count=s.size;
  if(!bar){
    bar=document.createElement('div');
    bar.id='selbar_'+ns;
    bar.style.cssText='position:fixed;top:0;left:240px;right:0;background:var(--navy);border-bottom:2px solid var(--acc);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:500;box-shadow:0 6px 24px rgba(0,0,0,.4);flex-wrap:wrap';
    document.body.appendChild(bar);
  }
  bar.innerHTML=`<div style="color:#fff;font-size:13px;font-weight:700">${count} selecionado${count>1?'s':''}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${typeof extraActionsHtml==='string'?extraActionsHtml:(window['_selExtra_'+ns]?window['_selExtra_'+ns](count):'')}
      <button class="btn bs bsm" onclick="selClear('${ns}')">✕ Limpar seleção</button>
      <button class="btn bd bsm" onclick="window['_selDelAction_${ns}'] && window['_selDelAction_${ns}']()">🗑️ Excluir selecionados</button>
    </div>`;
}
// Gera o <th> com checkbox "selecionar todos" + os <td> com checkbox de cada linha.
// As chaves vão num atributo data-* (em vez de dentro do onclick) para evitar que
// aspas dentro do JSON quebrem o atributo onclick="..." do HTML.
function selHeaderCell(ns,keys){
  const keysAttr=esc(JSON.stringify(keys));
  return `<th style="width:34px;text-align:center"><input type="checkbox" id="selAll_${ns}" data-keys="${keysAttr}" onclick="selToggleAll('${ns}',JSON.parse(this.dataset.keys),this.checked)" style="width:15px;height:15px;cursor:pointer"></th>`;
}
function selRowCell(ns,key){
  key=String(key);
  const checked=SEL[ns].has(key);
  return `<td style="text-align:center" onclick="event.stopPropagation()"><input type="checkbox" class="selRow" data-ns="${ns}" data-key="${esc(key)}" ${checked?'checked':''} onchange="selToggle('${ns}','${esc(key)}')" style="width:15px;height:15px;cursor:pointer"></td>`;
}

// Trava genérica contra duplo clique: desabilita o botão clicado durante a execução de fn.
// Usar como: onclick="lockBtn(this,()=>svNovEQ())"
function lockBtn(btn,fn){
  if(!btn||btn.disabled)return;
  const old=btn.textContent;
  btn.disabled=true;btn.textContent='Salvando...';
  try{ fn(); }finally{
    // O modal normalmente fecha (cm()) após salvar, então não precisa reabilitar;
    // mas se o botão ainda existir no DOM (ex: validação falhou e modal continua aberto), reabilita.
    setTimeout(()=>{ if(document.body.contains(btn)){btn.disabled=false;btn.textContent=old;} },50);
  }
}

function tvRender(){
  const body = document.getElementById('tv-body');
  if(!body) return;

  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const pd = s=>{if(!s)return null;const[d,m,y]=s.split('/');return new Date(+y,+m-1,+d);};

  // Pega o ano/mês do dashboard ou usa o atual
  const ano = _dashAno || new Date().getFullYear();
  const mes = _dashMes || null;

  const os = OS_DATA.filter(o=>_incluiOSNoPeriodo(o,ano,mes));

  const total  = os.length;
  const conc   = os.filter(o=>o.status==='Concluída').length;
  const andamento = os.filter(o=>o.status==='Em Andamento').length;
  const emg    = os.filter(o=>o.status==='Emergência').length;
  const agu    = os.filter(o=>o.status==='Aguardando').length;
  const atr    = os.filter(o=>o.status!=='Concluída'&&pd(o.dataPrevista)&&pd(o.dataPrevista)<hoje).length;

  // Gauges
  const corrConc = os.filter(o=>o.tipo==='Corretiva'&&o.status==='Concluída'&&+o.hhReal>0);
  const mttr = corrConc.length>0 ? +(corrConc.reduce((a,o)=>a+(+o.hhReal||0),0)/corrConc.length).toFixed(1) : null;
  const _indEquipTV = _calcIndicadoresEquip(ano, mes);
  const mtbf = _indEquipTV.mtbf!==null ? +_indEquipTV.mtbf.toFixed(0) : null;
  const disp = _indEquipTV.disponibilidade!==null ? +_indEquipTV.disponibilidade.toFixed(1) : 100;
  const ef   = total>0 ? +(conc/total*100).toFixed(1) : 0;
  const osPrev = os.filter(o=>o.tipo==='Preventiva').length;
  const osPrevConc = os.filter(o=>o.tipo==='Preventiva'&&o.status==='Concluída').length;
  const ad = osPrev>0 ? +(osPrevConc/osPrev*100).toFixed(1) : null;

  // Paradas de Linha no período (Emergência pressionada + Rejeito cheio)
  const paradasPeriodo = PARADAS_DATA.filter(p=>{
    if(!p.inicio) return false;
    const dt = new Date(p.inicio);
    if(isNaN(dt)) return false;
    const pAno = dt.getFullYear(), pMes = dt.getMonth()+1;
    if(mes!==null) return pAno===ano && pMes===mes;
    return pAno===ano;
  });
  const paradasEmg  = paradasPeriodo.filter(p=>p.categoria==='EMERGÊNCIA').length;
  const paradasRej  = paradasPeriodo.filter(p=>p.categoria==='REJEITO').length;
  const paradasSoma = paradasEmg + paradasRej;

  function ring(pct, color, val, lbl, meta, ok){
    const r=17, circ=2*Math.PI*r;
    const dash = (pct/100)*circ;
    const statusBg = ok ? 'rgba(34,197,94,.15)' : 'rgba(239,68,68,.15)';
    const statusClr = ok ? '#22c55e' : '#ef4444';
    const statusTxt = ok ? '✓ OK' : '✗ Atenção';
    return `<div class="tv-gauge">
      <div class="tv-gauge-ring">
        <svg width="42" height="42" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/>
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="${color}" stroke-width="4"
            stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"/>
        </svg>
        <div class="tv-gauge-val" style="color:${color}">${val}</div>
      </div>
      <div class="tv-gauge-info">
        <div class="tv-gauge-lbl" style="color:#e2e8f0">${lbl}</div>
        <div class="tv-gauge-meta">Meta: ${meta}</div>
        <div class="tv-gauge-status" style="background:${statusBg};color:${statusClr}">${statusTxt}</div>
      </div>
    </div>`;
  }

  // OS em andamento e emergência para lista
  const urgentes = [
    ...os.filter(o=>o.status==='Emergência'),
    ...os.filter(o=>o.status==='Em Andamento'),
    ...os.filter(o=>o.status!=='Concluída'&&pd(o.dataPrevista)&&pd(o.dataPrevista)<hoje),
  ].filter((o,i,a)=>a.findIndex(x=>x.id===o.id)===i).slice(0,8);

  const tipoCor = {Corretiva:'#ef4444',Preventiva:'#3b82f6',Melhoria:'#22c55e',Preditiva:'#f97316'};
  const stCor   = {'Emergência':'#c026d3','Em Andamento':'#3b82f6','Aguardando':'#f59e0b','Planejada':'#8b5cf6','Concluída':'#22c55e'};

  // KPIs — linha 1: 4 cards principais
  const kpisRow1 = [
    {v:total,      l:'Total OS',      sub:'no período',   c:'#f97316'},
    {v:conc,       l:'Concluídas',    sub:'finalizadas',  c:'#22c55e'},
    {v:andamento,  l:'Em Andamento',  sub:'em execução',  c:'#3b82f6'},
    {v:emg,        l:'Emergências',   sub:'atenção imediata', c:'#c026d3'},
  ];
  // KPIs — linha 2: mais 4
  const kpisRow2 = [
    {v:agu,        l:'Aguardando',    sub:'na fila',      c:'#f59e0b'},
    {v:atr,        l:'Em Atraso',     sub:'vencidas',     c:'#ef4444'},
    {v:os.filter(o=>o.tipo==='Preventiva').length, l:'Preventivas', sub:'no período', c:'#60a5fa'},
    {v:os.filter(o=>o.tipo==='Corretiva').length,  l:'Corretivas',  sub:'no período', c:'#f87171'},
  ];

  const kpiCard = k => `<div class="tv-kpi">
    <div class="tv-kpi-accent" style="background:${k.c}"></div>
    <div class="tv-kpi-val" style="color:${k.c}">${k.v}</div>
    <div class="tv-kpi-lbl">${k.l}</div>
    <div class="tv-kpi-sub">${k.sub}</div>
  </div>`;

  const kpiHtml1 = `<div class="tv-kpis-row">${kpisRow1.map(kpiCard).join('')}</div>`;
  const kpiHtml2 = `<div class="tv-kpis-row">${kpisRow2.map(kpiCard).join('')}</div>`;

  // KPIs — linha 3: Paradas de Linha (Emergência pressionada + Rejeito cheio)
  const kpisRow3 = [
    {v:paradasEmg,  l:'Emergência Pressionada', sub:'paradas de linha', c:'#c026d3'},
    {v:paradasRej,  l:'Rejeito Cheio',          sub:'paradas de linha', c:'#f59e0b'},
    {v:paradasSoma, l:'Total de Paradas',       sub:'emerg. + rejeito', c:'#ef4444'},
  ];
  const kpiHtml3 = `<div class="tv-kpis-row" style="grid-template-columns:repeat(3,1fr)">${kpisRow3.map(kpiCard).join('')}</div>`;

  const gaugeHtml = `<div class="tv-gauges">
    ${ring(mtbf!==null?Math.min(mtbf/300*100,100):0, mtbf!==null&&mtbf>=300?'#22c55e':'#ef4444', mtbf!==null?mtbf+'h':'—', 'MTBF','≥300h',mtbf!==null&&mtbf>=300)}
    ${ring(mttr!==null?Math.min((4/Math.max(mttr,.1))*100,100):0, mttr!==null&&mttr<=4?'#22c55e':'#ef4444', mttr!==null?mttr+'h':'—', 'MTTR','≤4h',mttr!==null&&mttr<=4)}
    ${ring(disp, disp>=95?'#22c55e':'#ef4444', disp+'%', 'Disponibilidade','≥95%',disp>=95)}
    ${ring(ef,   ef>=80?'#22c55e':'#f59e0b',   ef+'%',   'Eficiência','≥80%',ef>=80)}
    ${ring(ad||0,ad!==null?(ad>=80?'#22c55e':'#f59e0b'):'#6b7a9b', ad!==null?ad+'%':'—', 'Prev. Concluídas','≥80%',ad!==null&&ad>=80)}
  </div>`;

  // ── Evolução (Mensal/Anual) — preenche o espaço abaixo dos gauges ──
  const MESES_TV=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const evoMeses=MESES_TV.map((nm,i)=>{
    const mi=i+1;
    const osM=OS_DATA.filter(o=>_incluiOSNoPeriodo(o,ano,mi));
    return {nm,total:osM.length,conc:osM.filter(o=>o.status==='Concluída').length,
      atr:osM.filter(o=>o.status!=='Concluída'&&pd(o.dataPrevista)&&pd(o.dataPrevista)<hoje).length};
  }).filter(m=>m.total>0);
  const evoMensalLabels=evoMeses.map(m=>m.nm);
  const evoMensalAbertas=evoMeses.map(m=>m.total);
  const evoMensalConc=evoMeses.map(m=>m.conc);
  const evoMensalAtr=evoMeses.map(m=>m.atr);

  const tvUsandoAnual = _tvEvoView === 'anual';
  const evoAnualTV = tvUsandoAnual ? _evoAnual() : null;
  const evoLabels  = tvUsandoAnual ? evoAnualTV.labels  : evoMensalLabels;
  const evoAbertas = tvUsandoAnual ? evoAnualTV.abertas : evoMensalAbertas;

  const evoTitulo  = tvUsandoAnual ? '📈 Evolução Anual' : `📈 Evolução Mensal — ${ano}`;

  const evoToggleBtn = (v,lbl) => {
    const ativo = _tvEvoView===v;
    return `<button onclick="tvToggleEvoView('${v}')" style="padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid ${ativo?'#f97316':'rgba(255,255,255,.15)'};background:${ativo?'rgba(249,115,22,.15)':'transparent'};color:${ativo?'#f97316':'#94a3b8'};transition:all .15s">${lbl}</button>`;
  };

  const evoHtml = `<div class="tv-stat-block" style="flex:1;min-height:150px">
    <div class="tv-list-header">
      <span>${evoTitulo}</span>
      <span style="display:flex;gap:6px;margin-left:auto">${evoToggleBtn('mensal','Mensal')}${evoToggleBtn('anual','Anual')}</span>

    <div style="flex:1;min-height:110px;position:relative;padding:14px 20px">

function rDash(c){
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const pd=s=>{if(!s)return null;const[d,m,y]=s.split('/');return new Date(+y,+m-1,+d);};
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // Anos disponíveis nas OS

  const total=os.length;


  // ── Indicadores de performance REAIS ──

  const mttrVal=corrConc.length>0?+(corrConc.reduce((a,o)=>a+(+o.hhReal||0),0)/corrConc.length).toFixed(1):null;
  // MTBF e Disponibilidade: baseados no histórico real de paradas dos Equipamentos (status Parado/Em Manutenção, e OS com "esteira parada")

function rOST(){
  const b=osF.busca.toLowerCase(),hoje=new Date();hoje.setHours(0,0,0,0);
  const pd=s=>{if(!s)return null;const[d,m,y]=s.split('/');return new Date(+y,+m-1,+d);};
  const ehPrev = osF.origem==='preventivo';
  // Com QUALQUER filtro de status específico (Planejada, Aguardando, Em Andamento, Concluída,
  // Emergência...), não existe mais separação por origem — Todas e Plano Preventivo aparecem
  // juntas na mesma lista, e as OS de Plano Preventivo só entram se a Data Prevista cair no
  // mês/ano REAIS de hoje (não importa o mês em que a OS foi gerada). Com o filtro em "Todos",
  // a separação por origem (abas Todas / Plano Preventivo) continua funcionando normalmente.
  const statusUnificado = osF.status!=='Todos';
  const agoraReal = new Date();
  const f=OS_DATA.filter(o=>{
    const s=(o.id+o.equipamento+o.area+o.executante+o.tag).toLowerCase().includes(b);
    const st=osF.status==='Todos'||o.status===osF.status;
    const tp=osF.tipo==='Todos'||o.tipo===osF.tipo;
    // Filtro de Origem (novo, independente das sub-abas): restringe entre OS do Plano
    // Preventivo e OS normais, dentro do que já está sendo mostrado pelas sub-abas/status.
    const og=osF.origemFiltro==='preventivo'?!!o.planoPrevId:osF.origemFiltro==='normal'?!o.planoPrevId:true;
    // Aba "Plano Preventivo": só as que AINDA NÃO foram concluídas. Assim que uma OS de
    // plano preventivo é concluída, ela "sai" dessa aba e passa a aparecer em "Todas".
    // Aba "Todas": as OS normais + as de plano preventivo que já foram concluídas.
    const org=ehPrev?(!!o.planoPrevId&&o.status!=='Concluída'):(!o.planoPrevId||o.status==='Concluída');
    // O atalho "⏰ Em Atraso" do Dashboard conta TODAS as OS atrasadas, incluindo as de Plano Preventivo —
    // então aqui ele ignora a separação por origem, senão a contagem não bateria com o card do Dashboard
    if(osF._atraso){const dp=pd(o.dataPrevista);return s&&tp&&og&&o.status!=='Concluída'&&dp&&dp<hoje;}
    if(statusUnificado){
      if(o.planoPrevId){
        const dp=_parseDt(o.dataPrevista);
        if(!dp||dp.ano!==agoraReal.getFullYear()||dp.mes!==(agoraReal.getMonth()+1)) return false;
      }
      return s&&st&&tp&&og;
    }
    return s&&st&&tp&&org&&og;
  }).sort((a,b2)=>{
    if(ehPrev && !statusUnificado){
      // Aba Plano Preventivo: mostra primeiro a que está mais próxima (ou mais atrasada) da Data Prevista
      const pa=pd(a.dataPrevista), pb=pd(b2.dataPrevista);
      const xa=pa?pa.getTime():Infinity, xb=pb?pb.getTime():Infinity;
      return xa-xb;
    }
    // "Todas" (e "Aguardando" unificado): mais recente primeiro, por data de abertura e, no empate, pela hora de abertura
    const da=pd(a.dataAbertura), db=pd(b2.dataAbertura);
    const ta=da?da.getTime():0, tb=db?db.getTime():0;
    if(tb!==ta) return tb-ta;
    return (b2.horaAbertura||'').localeCompare(a.horaAbertura||'');
  });
  // Fixa no topo as OS atribuídas ao usuário logado (ainda não concluídas), mantendo a
  // ordenação relativa entre elas e entre as demais.
  if(currentUser){
    const minhas=[], resto=[];
    f.forEach(o=>{ (o.atribuidoA===currentUser.username && o.status!=='Concluída') ? minhas.push(o) : resto.push(o); });
    f.splice(0,f.length,...minhas,...resto);
  }
  const w=R('ostw');
  if(!f.length){w.innerHTML=`<div class="emp"><div style="font-size:40px;margin-bottom:10px">🔍</div>${osF.origem==='preventivo'&&!statusUnificado?'Nenhuma OS gerada por Plano Preventivo encontrada':'Nenhuma OS encontrada'}</div>`;return;}
  const admin=isAdmin();
  const selTh=admin?selHeaderCell('os',f.map(o=>o.id)):'';
  // Colunas da aba "Plano Preventivo" só valem quando ela está isolada (sem Tipo/Prior./Executante/Data
  // de abertura, com Descrição e Data Prevista). No modo "Aguardando" unificado, usa sempre as colunas padrão.
  const usaColunasPrev = ehPrev && !statusUnificado;
  const rows=f.map(o=>{
    const minhaAtrib = currentUser && o.atribuidoA===currentUser.username && o.status!=='Concluída';
    return `<tr onclick="openOS('${esc(o.id)}')" style="cursor:pointer;${minhaAtrib?'border-left:3px solid #a855f7;background:rgba(168,85,247,.05)':''}"

function abrirConcluir(){

function prevFotos(input){
  const files = Array.from(input.files);
  if(!files.length) return;
  window._fotoFiles = files; // array de arquivos
  const grid = R('foto-prev-grid');
  if(!grid) return;
  grid.innerHTML = '';
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const div = document.createElement('div');
      div.style.cssText = 'position:relative;display:inline-block';
      div.innerHTML = `<img src="${e.target.result}" alt="Pré-visualização da foto selecionada" style="width:100px;height:75px;border-radius:8px;border:1px solid var(--bdr);object-fit:cover">
        <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);border-radius:0 0 8px 8px;font-size:10px;color:#fff;padding:2px 4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${file.name}</div>`;
      grid.appendChild(div);
    };
    reader.readAsDataURL(file);
  });
}
// Compatibilidade com código antigo
function prevFoto(input){ prevFotos(input); }

// Faz upload da foto para o Supabase Storage e retorna a URL pública
async function _uploadFoto(osId, file){
  const ext = file.name.split('.').pop();
  const path = osId + '_' + Date.now() + '.' + ext;
  const res = await fetch(SB_URL + '/storage/v1/object/os-fotos/' + path, {
    method: 'POST',
    headers: {
      'apikey':        SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type':  file.type,
      'x-upsert':      'true',
    },
    body: file,
  });
  if(!res.ok) return null;
  return SB_URL + '/storage/v1/object/public/os-fotos/' + path;
}

function mudarStatusOS(novoStatus){
  const os=OS_DATA.find(o=>o.id===window._osEditId);if(!os)return;
  os.status=novoStatus;
  if(novoStatus==='Em Andamento' && !os.dataInicio){
    const ag=new Date();
    os.dataInicio=ag.toLocaleDateString('pt-BR');
    os.horaInicio=ag.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
  saveAll();cm();rOST();
}

// Remove uma foto específica da OS pelo índice
async function removerFotoOS(osId, idx){
  const os = OS_DATA.find(o=>o.id===osId);
  if(!os) return;
  const fotos = Array.isArray(os.foto)
    ? os.foto
    : (os.foto && os.foto.startsWith('[') ? JSON.parse(os.foto) : [os.foto]).filter(Boolean);
  const url = fotos[idx];
  // Remove do Storage
  if(url && url.includes('/storage/v1/object/public/os-fotos/')){
    const path = url.split('/storage/v1/object/public/os-fotos/')[1];
    await fetch(SB_URL+'/storage/v1/object/os-fotos/'+path,{
      method:'DELETE',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    }).catch(()=>{});
  }
  fotos.splice(idx,1);
  os.foto = JSON.stringify(fotos);
  saveAll();
  openOS(osId); // recarrega o modal
}

async function confirmarConclusao(){
  const os=OS_DATA.find(o=>o.id===window._osEditId);if(!os)return;
  const esteiraResp = _lerRadioSimNao('conc-esteira');
  if(!esteiraResp){
    alert('Responda se a esteira/linha ficou parada durante o serviço (Sim ou Não) antes de concluir a OS.');
    return;
  }
  const hhRealInformado = (R('conc-hhr-h')||R('conc-hhr-m')) ? _lerTempoEstimado('conc-hhr') : (os.hhReal||0);
  if(esteiraResp==='Sim' && !(hhRealInformado>0)){
    alert('Como a esteira ficou parada, é obrigatório informar o HH Real (tempo trabalhado) antes de concluir a OS.');
    return;
  }
  const ag=new Date();
  os.status='Concluída';
  os.okTecnico=true;
  os.esteiraParada=esteiraResp;
  os.dataConclusao=R('conc-data')?R('conc-data').value:ag.toLocaleDateString('pt-BR');
  os.horaConclusao=R('conc-hora')?R('conc-hora').value:ag.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  os.hhReal=hhRealInformado;
  if(R('conc-resp') && R('conc-resp').value.trim()) os.executante = R('conc-resp').value.trim();
  if(R('conc-ar-1')||R('conc-ar-2')||R('conc-ar-3')){
    const areaConc = ['Fase 1','Fase 2','Fase 3'].filter(f=>R('conc-ar-'+f.slice(-1))&&R('conc-ar-'+f.slice(-1)).checked).join(' + ');
    if(areaConc) os.area = areaConc;
  }
  // Upload de múltiplas fotos para o Supabase Storage
  const _arquivos = window._fotoFiles || (window._fotoFile ? [window._fotoFile] : []);
  if(_arquivos.length > 0){
    _ind('↻ Enviando fotos...','#f97316',false);
    const fotosExist = os.foto
      ? (Array.isArray(os.foto) ? os.foto : (os.foto.startsWith('[') ? JSON.parse(os.foto) : [os.foto])).filter(Boolean)
      : [];
    const novasUrls = [];
    for(const file of _arquivos){
      const url = await _uploadFoto(os.id, file);
      if(url) novasUrls.push(url);
    }
    os.foto = JSON.stringify([...fotosExist, ...novasUrls]);
    window._fotoFiles = null;
    window._fotoFile = null;
  }
  if(R('conc-pc-lista')) os.pecasUsadas = _pcAplicarDiferenca(os.pecasUsadas, _pcTemp);
  _sincronizarParadaEquipamentoPorOS(os);
  _onOSConcluida(os);
  saveAll();cm();rOST();
}

function svOS(id){
  const os=OS_DATA.find(o=>o.id===id);
  if(!os){alert('OS não encontrada.');return;}
  if(os.planoPrevId && !isAdmin()){alert('Esta OS foi gerada automaticamente por um Plano Preventivo e só pode ser editada por administradores.');cm();return;}
  // Salva todos os campos editáveis
  const _esteiraLida = _lerRadioSimNao('e-esteira');
  const _novoStatusPretendido = R('e-st') ? R('e-st').value : os.status;
  if(_novoStatusPretendido==='Concluída'){
    if(!_esteiraLida){
      alert('Responda se a esteira/linha ficou parada durante o serviço (Sim ou Não) antes de concluir a OS.');
      return;
    }
    const _hhRealPretendido = (R('e-hr-h')||R('e-hr-m')) ? _lerTempoEstimado('e-hr') : (os.hhReal||0);
    if(_esteiraLida==='Sim' && !(_hhRealPretendido>0)){
      alert('Como a esteira ficou parada, é obrigatório informar o HH Real (tempo trabalhado) antes de concluir a OS.');

    }

    os.atribuidoA = novoAtrib;

  if(R('e-eq')){
